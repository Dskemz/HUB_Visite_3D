      pipe.bloomWeight    = GRADE.bloomWeight;
      pipe.bloomKernel    = GRADE.bloomKernel;
      pipe.bloomScale     = GRADE.bloomScale;
    }

    pipe.sharpenEnabled = true;
    pipe.sharpen.edgeAmount  = GRADE.sharpenEdge;
    pipe.sharpen.colorAmount = GRADE.sharpenColor;

    if (GRADE.grain > 0) {
      pipe.grainEnabled = true;
      pipe.grain.intensity = GRADE.grain;
      pipe.grain.animated  = true;
    }

    window.compositingPipeline = pipe;  // réglages live possibles depuis la console
    console.log('✅ Compositing réaliste activé (ACES + grade + bloom + netteté + vignette)');

    // --- AO DE CONTACT (SSAO2) — rendu plein écran → aucun artefact ---
    // Assombrit les recoins (jonctions mur/sol/plafond, dessous des meubles) : c'est ce
    // qui « pose » les objets et donne la profondeur. Rendu à 50% de résolution (léger).
    // Piloté par GRADE (lui-même alimenté par lighting-config.json → éditable).
    // AO créé dès que WebGL2 le permet (même si désactivé au départ : on démarre à
    // strength 0), pour que l'éditeur puisse l'activer en direct sans recharger.
    if (BABYLON.SSAO2RenderingPipeline && engine.webGLVersion > 1) {
      const aoOn = GRADE.ao;
      const ssao2 = new BABYLON.SSAO2RenderingPipeline('ssao2', scene,
        { ssaoRatio: 0.5, blurRatio: 0.5 }, [camera]);
      ssao2.radius        = GRADE.aoRadius;
      ssao2.totalStrength = aoOn ? GRADE.aoStrength : 0;
      ssao2.base          = GRADE.aoBase;
      ssao2.samples       = 16;
      ssao2.maxZ          = 60;
      ssao2.minZAspect    = 0.5;
      ssao2.expensiveBlur = false;
      try { const sky = scene.getMeshByName('skybox'); if (sky) ssao2.addExcludedMesh(sky); } catch (_) {}
      window.ssao2Pipeline = ssao2;
      window.__AO_STRENGTH__ = aoOn ? GRADE.aoStrength : 0; // puissance courante (restaurée après l'ortho)
      // API simple pour l'éditeur : ajuster l'AO en direct sans recharger.
      window.setAO = function(opts) {
        opts = opts || {};
        if (!window.ssao2Pipeline) return;
        if (opts.strength != null) { window.ssao2Pipeline.totalStrength = opts.strength; window.__AO_STRENGTH__ = opts.strength; }
        if (opts.radius   != null) window.ssao2Pipeline.radius = opts.radius;
        if (opts.base     != null) window.ssao2Pipeline.base   = opts.base;
      };
      console.log('✅ SSAO2 (occlusion de contact) ' + (aoOn ? 'activé' : 'prêt (désactivé)'));
    }
  } catch (e) {
    console.warn('⚠️ Compositing non activé, rendu standard :', e.message);
    // Repli minimal pour ne jamais casser le rendu
    scene.imageProcessingConfiguration.toneMappingEnabled = true;
    scene.imageProcessingConfiguration.exposure = 1.0;
    scene.imageProcessingConfiguration.contrast = 1.1;
  }

  // Afficher axes de coordonnées (debug)
  // createAxesHelper();

  // Charger le plafond (masqué par défaut)
  await loadCeiling();

  // Icône initiale du bouton (vue de dessus)
  updateToggleButton();

  engine.runRenderLoop(() => {
   try {
    scene.render();
    
    // ========== AFFICHER/MASQUER PLAFOND BASÉ SUR HAUTEUR CAMÉRA ==========
    if (ceilingNode && ceilingHeight > 0) {
      // On teste TOUJOURS la caméra réellement rendue (scene.activeCamera), jamais une
      // supposition basée sur isFirstPerson : pendant l'animation d'entrée en POV, la
      // caméra visible est encore l'ArcRotate qui descend — la fpCamera n'est repositionnée
      // qu'à la fin. Lire fpCamera ici la faisait apparaître trop tôt (position périmée).
      const activeCam = scene.activeCamera || camera;
      const camY = activeCam.position.y;
      const isShown = ceilingNode.isEnabled();

      // Le plafond est VISIBLE quand la caméra est SOUS son niveau (on est dans la
      // pièce, on voit le plafond au-dessus de soi) et INVISIBLE quand elle est
      // AU-DESSUS (vue plongeante : on voit à travers, dans les pièces).
      // Petite marge (hystérésis) pour éviter tout clignotement au passage du seuil.
      const HYST = 0.05;
      if (!isShown && camY <= ceilingHeight - HYST) {
        ceilingNode.setEnabled(true);
      } else if (isShown && camY >= ceilingHeight + HYST) {
        ceilingNode.setEnabled(false);
      }
    }
   } catch (e) {
    // Une frame en erreur (transition, ressource en cours de restauration…) ne
    // doit jamais tuer la boucle de rendu : on ignore et on continue.
    console.warn('Frame ignorée (erreur transitoire) :', e);
   }
  });

  // Détecter les clics sur les marqueurs POI
  window.addEventListener('click', (event) => {
    // En mode placement, on navigue librement : pas de déclenchement POV.
    // (placementMode n'existe que dans l'éditeur ; dans le viewer public il est absent
    //  → on teste son existence pour ne pas lever de ReferenceError qui tuerait le clic.)
    if (typeof placementMode !== 'undefined' && placementMode) return;
    // Ne pas déclencher si on clique sur un bouton ou un élément UI
    if (event.target.closest('button') || event.target.closest('.poi-panel') ||
        event.target.closest('.info-panel') || event.target.closest('.toggle-panel-btn') ||
        event.target.closest('.placement-panel') || event.target.closest('.lightbox')) {
      return;
    }

    // Raycast prioritaire sur les marqueurs POV (ils sont rendus par-dessus)
    const pickMarker = scene.pick(event.clientX, event.clientY,
      (mesh) => mesh.isPickable && !!mesh.poiId);
    if (pickMarker && pickMarker.hit && pickMarker.pickedMesh && pickMarker.pickedMesh.poiId) {
      goToPOI(pickMarker.pickedMesh.poiId);
    }
  });

  // Recadrage centralisé (réutilisé par le resize ET la récupération de contexte WebGL)
  function relayout() {
    if (isAnimating) return;
    if (isFirstPerson && fpCamera) {
      applyViewportShift(fpCamera);
    } else if (isTopView) {
      applyTopViewViewport();
      camera.radius = computeTopViewRadius();
    } else {
      applyViewportShift(camera);
    }
  }

  window.addEventListener('resize', () => {
    engine.resize();
    relayout();
  });
}

/* ============================================================================
   VITRES x SSAO2 - pas d'occlusion de contact sur le verre
   ----------------------------------------------------------------------------
   Le SSAO2 est un effet ECRAN base sur la profondeur/normales (via le
   PrePassRenderer en WebGL2). Sur une vitre (transparence + legere refraction),
   les normales/profondeur ecrites sont celles du VERRE alors que la couleur, elle,
   montre le decor REFRACTE derriere : l'AO calcule sur la geometrie du verre se
   superpose a cette image refractee -> on voit "tout en double" a travers la vitre.
   On exclut donc les materiaux transparents/refractifs du prepass SSAO2. L'AO reste
   sur toute la geometrie opaque (murs, sols, meubles) ; le shader du verre s'affiche
   seul, tel quel (transparence + refraction), sans dedoublement.
   ============================================================================ */
function isGlassMaterial(mat) {
  if (!mat) return false;
  if (Array.isArray(mat.subMaterials)) return mat.subMaterials.some(isGlassMaterial);
  const blended    = (typeof mat.needAlphaBlending === 'function') ? mat.needAlphaBlending() : false;
  const semiTransp = (mat.alpha != null && mat.alpha < 0.999);
  const refractStd = !!mat.refractionTexture;                                   // StandardMaterial
  const refractPbr = !!(mat.subSurface && mat.subSurface.isRefractionEnabled);  // PBR / KHR_transmission
  return blended || semiTransp || refractStd || refractPbr;
}

function excludeGlassFromAO(root) {
  // SSAO2 (WebGL2) alimente sa profondeur/normales via le PrePassRenderer : on en
  // exclut les MATERIAUX de verre (API native `excludedMaterials`). En repli WebGL1
  // eventuel, SSAO2 passe par le geometryBufferRenderer (exclusion par mesh).
  const pp  = scene.prePassRenderer;
  const gbr = scene.geometryBufferRenderer;
  if (!pp && !gbr) return;
  const meshes = root && root.getChildMeshes ? root.getChildMeshes(false) : scene.meshes;
  let nMat = 0, nMesh = 0;
  meshes.forEach(m => {
    const mat = m.material;
    if (!mat || !isGlassMaterial(mat)) return;
    const subs = Array.isArray(mat.subMaterials) ? mat.subMaterials.filter(isGlassMaterial) : [mat];
    if (pp && Array.isArray(pp.excludedMaterials)) {
      subs.forEach(sm => { if (sm && pp.excludedMaterials.indexOf(sm) === -1) { pp.excludedMaterials.push(sm); nMat++; } });
    }
    if (gbr && Array.isArray(gbr.excludedMeshes) && gbr.excludedMeshes.indexOf(m) === -1) { gbr.excludedMeshes.push(m); }
    nMesh++;
  });
  if (nMat || nMesh) console.log('\uD83E\uDE9F Verre hors SSAO2 : ' + nMat + ' materiau(x), ' + nMesh + ' maille(s)');
}

/* ============================================================================
   LOAD MODELS
   ============================================================================ */
async function loadWalls() {
  const base = CONFIG.assetsBase(CONFIG.propertyId);
  try {
    const result = await importGlbResilient(base, CONFIG.wallsFile, scene);
    wallsRoot = groupUnder(result.meshes, 'wallsRoot');
    // Appliquer le décalage écran selon l'état du panneau AVANT le cadrage, pour que le
    // modèle soit cadré dans la zone réellement visible (gauche si panneau ouvert).
    applyViewportShift(camera);
    frameModel(wallsRoot);

    // Construire la liste des POV depuis le manifest
    rebuildPoiList();

    // Créer les marqueurs POV cliquables
    createPoiMarkers();

    // ========== OPTIMISATION TEXTURES (netteté vue oblique + moins de scintillement) ==========
    // Filtrage anisotrope : les textures vues en biais (sol, murs de côté) restent nettes
    // au lieu de devenir floues/scintillantes. Plafonné à 4× — au-delà, gain invisible mais
    // coût GPU réel. C'est un des réglages qui améliore le PLUS la qualité perçue pour presque
    // zéro coût. Appliqué à toutes les textures des murs/meubles chargés.
    try {
      const maxAniso = engine.getCaps().maxAnisotropy || 1;
      const aniso = Math.min(4, maxAniso);
      wallsRoot.getChildMeshes(false).forEach(mesh => {
        const mat = mesh.material;
        if (!mat) return;
        ['albedoTexture','bumpTexture','metallicTexture','reflectivityTexture',
         'ambientTexture','diffuseTexture','microSurfaceTexture'].forEach(slot => {
          const tex = mat[slot];
          if (tex && 'anisotropicFilteringLevel' in tex) tex.anisotropicFilteringLevel = aniso;
        });
      });
      console.log('✅ Filtrage anisotrope appliqué (netteté vues obliques) : ' + aniso + '×');
    } catch (e) { /* caps absentes : filtrage par défaut conservé */ }
    // Vitres : jamais d'occlusion de contact (evite l'image dedoublee a travers le verre)
    excludeGlassFromAO(wallsRoot);
  } catch (err) {
    console.error('Échec chargement walls.glb :', err);
    document.querySelector('#loading-bar h3').textContent = 'Modèle introuvable (walls.glb)';
  }
}


function groupUnder(meshes, name) {
  const root = new BABYLON.TransformNode(name, scene);
  meshes.forEach(m => { if (!m.parent) m.setParent(root); });
  return root;
}

/* ============================================================================
   CHARGEMENT GLB RÉSILIENT
   ----------------------------------------------------------------------------
   Objectif : que le viewer accepte N'IMPORTE QUEL .glb sans planter, même si
   le fichier contient des références de textures cassées (orphelines) — un cas
   fréquent après conversion WebP / réduction de textures dans Blender ou via
   un outil d'optimisation.

   Principe : on récupère le .glb en mémoire, on le « nettoie » (on retire les
   références de textures pointant vers une image source absente), puis on le
   passe à Babylon. Le modèle se charge ; seule la texture cassée est ignorée.
   Aucun renommage requis : tant que le nom dans le viewer correspond au fichier,
   ça fonctionne.
   ============================================================================ */
async function importGlbResilient(base, filename, scene) {
  let buffer = null;
  try {
    const resp = await fetch(base + filename);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    buffer = await resp.arrayBuffer();
  } catch (e) {
    // Si le fetch échoue (ex : protocole file://), on retombe sur le loader standard.
    console.warn(`⚠️ Fetch direct impossible pour ${filename}, chargement standard :`, e.message);
    return BABYLON.SceneLoader.ImportMeshAsync('', base, filename, scene);
  }

  let cleaned = buffer;
  try {
    cleaned = sanitizeGlbBuffer(buffer, filename);
  } catch (e) {
    console.warn(`⚠️ Nettoyage GLB ignoré pour ${filename} (chargement brut) :`, e.message);
    cleaned = buffer;
  }

  const file = new File([cleaned], filename, { type: 'model/gltf-binary' });
  return BABYLON.SceneLoader.ImportMeshAsync('', '', file, scene, null, '.glb');
}

/* Nettoie un buffer GLB : retire les références de textures sans image source
   valide. Retourne un nouvel ArrayBuffer (ou l'original si rien à corriger). */
function sanitizeGlbBuffer(arrayBuffer, label) {
  const dv = new DataView(arrayBuffer);
  const MAGIC_GLTF = 0x46546C67; // 'glTF'
  const TYPE_JSON  = 0x4E4F534A; // 'JSON'
  const TYPE_BIN   = 0x004E4942; // 'BIN\0'

  if (dv.getUint32(0, true) !== MAGIC_GLTF) return arrayBuffer; // pas un GLB binaire
  const total = dv.getUint32(8, true);

  // --- Lire les chunks JSON + BIN ---
  let jsonText = null, binChunk = null;
  let offset = 12;
  while (offset < total) {
    const chunkLen  = dv.getUint32(offset, true);
    const chunkType = dv.getUint32(offset + 4, true);
    const chunkData = arrayBuffer.slice(offset + 8, offset + 8 + chunkLen);
    if (chunkType === TYPE_JSON)      jsonText = new TextDecoder().decode(chunkData);
    else if (chunkType === TYPE_BIN)  binChunk = chunkData;
    offset += 8 + chunkLen;
  }
  if (!jsonText) return arrayBuffer;

  const gltf     = JSON.parse(jsonText);
  const images   = gltf.images   || [];
  const textures = gltf.textures || [];
  const nImages  = images.length;

  // Une texture est valide si elle a une source d'image existante,
  // que ce soit via `source` standard ou une extension (EXT_texture_webp, KHR_texture_basisu…).
  function textureHasValidSource(tex) {
    if (!tex) return false;
    const candidates = [];
    if (typeof tex.source === 'number') candidates.push(tex.source);
    if (tex.extensions) {
      for (const ext of Object.values(tex.extensions)) {
        if (ext && typeof ext.source === 'number') candidates.push(ext.source);
      }
    }
    return candidates.some(s => s >= 0 && s < nImages && images[s]);
  }

  const brokenTex = new Set();
  textures.forEach((t, i) => { if (!textureHasValidSource(t)) brokenTex.add(i); });
  if (brokenTex.size === 0) return arrayBuffer; // rien à corriger

  // Retirer, dans chaque matériau, les blocs « texture info » ({index:…}) pointant
  // vers une texture cassée. Parcours récursif pour couvrir les extensions PBR
  // (clearcoat, transmission, specular, anisotropy…).
  let removed = 0;
  function clean(obj) {
    if (Array.isArray(obj)) { obj.forEach(clean); return; }
    if (!obj || typeof obj !== 'object') return;
    for (const key of Object.keys(obj)) {
      const val = obj[key];
      if (val && typeof val === 'object' && !Array.isArray(val)
          && typeof val.index === 'number' && brokenTex.has(val.index)) {
        delete obj[key];
        removed++;
      } else {
        clean(val);
      }
    }
  }
  (gltf.materials || []).forEach(clean);

  console.log(`🧹 ${label || 'GLB'} : ${brokenTex.size} texture(s) orpheline(s) détectée(s), ${removed} référence(s) retirée(s) — chargement sécurisé.`);

  // --- Ré-emballer le GLB ---
  const enc = new TextEncoder();
  let jsonBytes = enc.encode(JSON.stringify(gltf));
  const jsonPad = (4 - (jsonBytes.length % 4)) % 4;
  if (jsonPad) {
    const p = new Uint8Array(jsonBytes.length + jsonPad);
    p.set(jsonBytes);
    p.fill(0x20, jsonBytes.length); // espaces
    jsonBytes = p;
  }

  let binBytes = binChunk ? new Uint8Array(binChunk) : null;
  if (binBytes) {
    const binPad = (4 - (binBytes.length % 4)) % 4;
    if (binPad) {
      const p = new Uint8Array(binBytes.length + binPad);
      p.set(binBytes); // zéros
      binBytes = p;
    }
  }

  const hasBin   = !!binBytes;
  const totalLen = 12 + 8 + jsonBytes.length + (hasBin ? 8 + binBytes.length : 0);
  const out  = new ArrayBuffer(totalLen);
  const odv  = new DataView(out);
  const ob   = new Uint8Array(out);
  let o = 0;
  odv.setUint32(0, MAGIC_GLTF, true);
  odv.setUint32(4, 2, true);
  odv.setUint32(8, totalLen, true);
  o = 12;
  odv.setUint32(o, jsonBytes.length, true); o += 4;
  odv.setUint32(o, TYPE_JSON, true);        o += 4;
  ob.set(jsonBytes, o);                     o += jsonBytes.length;
  if (hasBin) {
    odv.setUint32(o, binBytes.length, true); o += 4;
    odv.setUint32(o, TYPE_BIN, true);        o += 4;
    ob.set(binBytes, o);                     o += binBytes.length;
  }
  return out;
}

/* ============================================================================
   CADRAGE AUTO
   ============================================================================ */
function frameModel(root) {
  let min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
  let max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
  let found = false;

  root.getChildMeshes(false).forEach(mesh => {
    if (!mesh.getTotalVertices || mesh.getTotalVertices() === 0) return;
    mesh.computeWorldMatrix(true);
    const bb = mesh.getBoundingInfo().boundingBox;
    min = BABYLON.Vector3.Minimize(min, bb.minimumWorld);
    max = BABYLON.Vector3.Maximize(max, bb.maximumWorld);
    found = true;
  });
  if (!found) return;

  const center = BABYLON.Vector3.Center(min, max);
  const radius = max.subtract(min).length() / 2;

  // IMPORTANT : on CLONE le centre pour modelBounds ET pour la cible caméra.
  // Sinon la cible et modelBounds.center partagent le même Vector3, et une
  // translation (pan) — qui modifie la cible EN PLACE — corromprait le centre
  // stocké → la « vue de dessus » recadrerait sur le point translaté au lieu du
  // vrai centre du modèle.
  modelBounds = {min, max, center: center.clone(), radius};

  const fovV = camera.fov;
  const aspect = engine.getAspectRatio(camera);
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * aspect);
  const limitingFov = Math.min(fovV, fovH);
  const distance = (radius / Math.sin(limitingFov / 2)) * CONFIG.fitMargin;

  camera.setTarget(center.clone());
  camera.radius = distance;

  camera.lowerRadiusLimit = radius * zoomInRatio();
  camera.upperRadiusLimit = distance * CONFIG.zoomOutLimitRatio;

  camera.minZ = radius * CONFIG.clipNearRatio;
  camera.maxZ = distance * CONFIG.clipFarRatio;

  initialFraming = {
    target: center.clone(),
    radius: distance,
    alpha: -Math.PI / 2,
    beta: Math.PI / 2.5,
  };

  console.log(`✅ Cadré — centre ${center}, rayon ${radius.toFixed(2)}, distance ${distance.toFixed(2)}`);
}

/* Ramène un angle alpha à son équivalent le plus proche de la cible (évite de rejouer
   plusieurs tours accumulés). Le saut est invisible : même orientation modulo 360°. */
function wrapAlphaNear(current, target) {
  const twoPi = Math.PI * 2;
  let a = current;
  while (a - target > Math.PI)  a -= twoPi;
  while (a - target < -Math.PI) a += twoPi;
  return a;
}

function resetView() {
  if (!initialFraming || isAnimating) return;
  isAnimating = true;
  isTopView = false; // on quitte la vue de dessus
  setHudVisible(false); // masque le HUD plan

  // Si on sortait d'une vue 1ère personne, restaurer l'état "visite"
  if (isFirstPerson) {
    exitPanoramaCamera();               // rebascule sur l'ArcRotate, alignée sur la vue panorama
    isFirstPerson = false;
    currentPoiId = null;
    setMarkersVisible(true);
    rebuildPoiList();
    camera.panningSensibility = 300;    // translation au clic droit réactivée
    camera.angularSensibilityX = 1000;  // vitesse de rotation de navigation
    camera.angularSensibilityY = 1000;
  }

  // Stopper tout observer d'animation en cours (sécurité anti-conflit)
  if (currentAnimObserver) {
    scene.onBeforeRenderObservable.remove(currentAnimObserver);
    currentAnimObserver = null;
  }

  // Repasser en perspective
  camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;
  // Réactiver l'AO (neutralisée en vue de dessus ortho de l'éditeur)
  try { if (window.ssao2Pipeline && window.__AO_STRENGTH__ != null) window.ssao2Pipeline.totalStrength = window.__AO_STRENGTH__; } catch (_) {}

  // Libérer temporairement les limites de zoom pour permettre l'éloignement
  // (en 1ère personne, lower=upper=radius bloquerait l'animation)
  camera.lowerRadiusLimit = null;
  camera.upperRadiusLimit = null;
  // Restaurer les limites d'angle vertical de navigation
  camera.lowerBetaLimit = 0.05;
  camera.upperBetaLimit = Math.PI / 2 + 0.15;

  // États de départ et d'arrivée
  const startViewportWidth = getEffectiveViewportWidthAtStart(); // largeur utile de départ
  const targetViewportWidth = getEffectiveViewportWidth(); // Considère l'état du panneau
  const startRadius = camera.radius;
  const startBeta = camera.beta;
  const startAlpha = wrapAlphaNear(camera.alpha, initialFraming.alpha);
  const targetRadius = computeFitRadiusForViewport(getEffectiveViewportWidth());
  const targetBeta = initialFraming.beta;
  const targetAlpha = initialFraming.alpha;
  const startTarget = camera.target.clone();
  const targetCenter = initialFraming.target.clone();
  const startFov = camera.fov;
  const targetFovValue = defaultFov;

  const totalFrames = 90;
  let frame = 0;

  currentAnimObserver = scene.onBeforeRenderObservable.add(() => {
    frame++;
    const t = Math.min(frame / totalFrames, 1);
    const eased = easeInOut(t);

    // Rendu TOUJOURS plein écran ; le décalage écran suit en continu (pas de "clac")
    const vpWidth = startViewportWidth + (targetViewportWidth - startViewportWidth) * eased;
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);

    // Caméra revient à sa position de navigation
    camera.target = BABYLON.Vector3.Lerp(startTarget, targetCenter, eased);
    camera.radius = startRadius + (targetRadius - startRadius) * eased;
    camera.beta = startBeta + (targetBeta - startBeta) * eased;
    camera.alpha = startAlpha + (targetAlpha - startAlpha) * eased;
    camera.fov = startFov + (targetFovValue - startFov) * eased;
    if (camera.targetScreenOffset) camera.targetScreenOffset.x = computeScreenShiftX(vpWidth, camera);

    if (t >= 1) {
      scene.onBeforeRenderObservable.remove(currentAnimObserver);
      currentAnimObserver = null;
      // Restaurer les limites de zoom de navigation
      camera.lowerRadiusLimit = modelBounds.radius * zoomInRatio();
      camera.upperRadiusLimit = initialFraming.radius * CONFIG.zoomOutLimitRatio;
      camera.minZ = modelBounds.radius * CONFIG.clipNearRatio;
      camera.fov = defaultFov;
      // Fin propre : décalage écran net + contrôles réactivés
      applyViewportShift(camera);
      camera.attachControl(document.getElementById('canvas'), true);
      isAnimating = false;
      updateToggleButton();
    }
  });
}

/* ============================================================================
   CHARGEMENT DU PLAFOND
   ============================================================================ */
let ceilingHeight = 0; // Hauteur du plafond (calculée dynamiquement au besoin)

async function loadCeiling() {
  const base = CONFIG.assetsBase(CONFIG.propertyId);
  try {
    // Charger le GLB du plafond
    const result = await importGlbResilient(base, 'plafond.glb', scene);
    ceilingNode = groupUnder(result.meshes, 'ceiling');
    
    // Calculer la hauteur du plafond à partir des meshes enfants.
    // (ceilingNode est un TransformNode : il n'a PAS de getBoundingInfo() —
    //  l'appeler levait une exception et laissait ceilingHeight à 0, ce qui
    //  désactivait totalement la bascule du plafond.)
    let minY = Infinity, maxY = -Infinity;
    ceilingNode.getChildMeshes(false).forEach(mesh => {
      if (!mesh.getTotalVertices || mesh.getTotalVertices() === 0) return;
      mesh.computeWorldMatrix(true);
      const bb = mesh.getBoundingInfo().boundingBox;
      minY = Math.min(minY, bb.minimumWorld.y);
      maxY = Math.max(maxY, bb.maximumWorld.y);
    });
    // Seuil = sous-face du plafond (hauteur sous plafond de la pièce) : le plafond
    // apparaît dès que la caméra passe SOUS ce niveau, et disparaît au-dessus.
    ceilingHeight = (minY !== Infinity) ? minY : 0;

    // ========== CONSERVER LE MATÉRIAU DU GLB (texture AO bakée) ==========
    // IMPORTANT : on NE remplace PAS le matériau importé. Le plafond porte une
    // texture d'AO/lightmap bakée dans son GLB qui lui donne exactement la même
    // teinte que les murs. L'ancien code créait ici un StandardMaterial blanc
    // et l'assignait à chaque mesh : la texture bakée était jetée, et la sous-face
    // du plafond (orientée vers le bas) ne recevait plus que la `groundColor`
    // sombre des lumières hémisphériques → plafond « totalement foncé ».
    // On garde donc le matériau d'origine, exactement comme pour walls.glb.
    ceilingNode.getChildMeshes(false).forEach(mesh => {
      const mat = mesh.material;
      if (!mat) return;
      // S'assurer que l'AO bakée (chargée par le loader glTF dans ambientTexture)
      // contribue à pleine intensité, comme sur les murs.
      if (mat.ambientTexture) {
        mat.ambientTextureStrength = 1.0;
        if ('useAmbientInGrayScale' in mat) mat.useAmbientInGrayScale = true;
      }
      // La scène a déjà 4 lumières globales (spot + directionnelle + 2 hémi) ;
      // notre lumière d'appoint plafond serait la 5ᵉ et donc IGNORÉE (limite PBR
      // par défaut = 4). On relève la limite pour que l'appoint s'applique bien.
      if ('maxSimultaneousLights' in mat) mat.maxSimultaneousLights = 8;
    });

    // ========== PRÉ-COMPILER LES SHADERS (zéro latence à l'affichage) ==========
    // On force la compilation des matériaux d'origine pendant que le plafond est
    // encore caché, pour qu'il s'affiche INSTANTANÉMENT quand la caméra atteint
    // son niveau, sans le micro-figement de la 1ère frame de rendu.
    try {
      const compilations = [];
      ceilingNode.getChildMeshes(false).forEach(mesh => {
        if (mesh.material && mesh.material.forceCompilationAsync) {
          compilations.push(mesh.material.forceCompilationAsync(mesh));
        }
      });
      await Promise.all(compilations);
    } catch (e) {
      console.warn('⚠️ Pré-compilation plafond ignorée :', e.message);
    }

    // ========== APPOINT PLAFOND : LÉGER + TEINTÉ COMME L'UNIVERS ==========
    // Les murs prennent leurs teintes variées de l'IBL (la HDRi). Pour que le
    // plafond fasse PAREIL, on laisse l'IBL être sa source principale et on ne
    // garde qu'un appoint TRÈS léger, TEINTÉ CHAUD (cohérent avec la HDRi chaude)
    // plutôt qu'un blanc pur. Résultat : le plafond capte la teinte de l'univers
    // et varie naturellement comme les murs, sans être lessivé en blanc ni trop foncé.
    const ceilingMeshes = ceilingNode.getChildMeshes(false)
      .filter(m => m.getTotalVertices && m.getTotalVertices() > 0);
    const ceilingFill = new BABYLON.HemisphericLight(
      'ceilingFill', new BABYLON.Vector3(0, -1, 0), scene);
    const ceilTint = new BABYLON.Color3(1.0, 0.95, 0.88); // teinte chaude ~HDRi (pas de blanc pur)
    ceilingFill.diffuse     = ceilTint;
    ceilingFill.groundColor = ceilTint; // même teinte → appoint uniforme et chaud
    ceilingFill.specular    = new BABYLON.Color3(0, 0, 0);
    ceilingFill.intensity   = 0.35; // ⬅️ appoint léger : ↓ = plus dépendant de l'univers (plus varié), ↑ = plus uniforme/clair
    ceilingFill.includedOnlyMeshes = ceilingMeshes; // n'éclaire QUE le plafond

    // ========== CHARGER CACHÉ POUR ZÉRO LATENCE ==========
    ceilingNode.setEnabled(false);

    console.log('✅ Plafond pré-chargé caché — seuil sous-face:', ceilingHeight.toFixed(2));
  } catch (err) {
    console.warn('⚠️ Plafond non chargé :', err.message);
  }
}

/* ============================================================================
   ÉLÉMENTS PAR PIÈCE — chargement arrière-plan + switches cumulables
   L'enveloppe low-poly (wallsRoot) reste TOUJOURS visible et n'est jamais touchée ici.
   ============================================================================ */
function loadRoomsAsync() {
  // Source : manifest.json > rooms, sinon CONFIG.rooms (fallback éditable)
  roomList = (propertyData && Array.isArray(propertyData.rooms) && propertyData.rooms.length)
    ? propertyData.rooms
    : (CONFIG.rooms || []);

  if (!roomList.length) {
    console.log('ℹ️ Aucune pièce déclarée (manifest.rooms ou CONFIG.rooms vide) — section masquée.');
    return;
  }

  // Init de l'état + affichage des switches (désactivés tant que le GLB n'est pas prêt)
  roomList.forEach(r => { roomState[r.id] = { loaded: false, enabled: false, failed: false }; });
  if (!isFirstPerson) rebuildPoiList();

  const base = CONFIG.assetsBase(CONFIG.propertyId);

  // Chargement SÉQUENTIEL (un GLB à la fois) pour éviter de saturer le décodage Draco
  setTimeout(async () => {
    for (const r of roomList) {
      try {
        const result = await importGlbResilient(base, r.glb, scene);
        const node = groupUnder(result.meshes, 'room-' + r.id);
        node.setEnabled(!!CONFIG.roomsStartVisible);
        roomNodes[r.id] = node;
        roomState[r.id].loaded = true;
        roomState[r.id].enabled = !!CONFIG.roomsStartVisible;


        excludeGlassFromAO(node); // vitres du mobilier/piece : hors SSAO2
        console.log(`✅ Pièce « ${r.label} » chargée (${r.glb})`);
      } catch (err) {
        roomState[r.id].failed = true;
        console.warn(`⚠️ Pièce « ${r.label} » (${r.glb}) non chargée :`, err);
      }
      // Rafraîchir les switches au fil des chargements
      if (!isFirstPerson) {
        rebuildPoiList();
      } else {
        // En vue 1ère personne : si la pièce qui vient de (ne pas) charger est
        // celle du POV courant, on re-render le panneau pour activer son switch
        // (sinon il reste bloqué sur « chargement… » jusqu'à ce qu'on ressorte).
        refreshFirstPersonPanelIfRoom(r.id);
      }
    }
  }, CONFIG.roomsLoadDelay || 0);
}

/* Affiche/masque les éléments d'une pièce. Indépendant et cumulable.
   Recentre le GLB en douceur à chaque clic (jamais de cut). */
function toggleRoom(id, on) {
  const node = roomNodes[id];
  const st = roomState[id];
  if (!node || !st || !st.loaded) return;
  st.enabled = !!on;
  node.setEnabled(!!on);
  // NOTE : on NE recadre PAS la caméra. Afficher/masquer un élément ne doit jamais
  // déplacer la vue (sinon la caméra recule pour "tout voir").
}

/* Tout afficher / tout masquer */
function setAllRooms(on) {
  roomList.forEach(r => {
    const st = roomState[r.id];
    if (st && st.loaded && !st.failed) {
      st.enabled = !!on;
      if (roomNodes[r.id]) roomNodes[r.id].setEnabled(!!on);
    }
  });
  if (!isFirstPerson) rebuildPoiList();
  // Idem : pas de recadrage caméra sur "tout afficher / tout masquer".
}

/* Recentre le GLB global dans la zone visible avec la marge configurée, en douceur.
   Conserve l'orientation courante (nav) ou la vue de dessus selon le mode.
   Appelé à chaque clic de bouton pour remettre le modèle bien cadré. */
function recenterModel(animated) {
  // En 1ère personne on ne recentre pas (la caméra est dans une pièce)
  if (isFirstPerson) return;
  reframeForPanel(animated !== false);
}

}

const POV_EYE_HEIGHT = 1.6; // hauteur des yeux par défaut (m)

function generateDefaultPOIs() {
  if (!modelBounds) return [];
  const { min, max, center } = modelBounds;
  const w = max.x - min.x;
  const d = max.z - min.z;

  return DEFAULT_POI_LAYOUT.map(p => {
    const x = min.x + p.xFrac * w;
    const z = min.z + p.zFrac * d;
    const camPos = [x, POV_EYE_HEIGHT, z];
    // Cible par défaut : on regarde vers le centre de l'appart (sera affiné via le mode placement)
    let dirX = center.x - x, dirZ = center.z - z;
    const len = Math.sqrt(dirX*dirX + dirZ*dirZ) || 1;
    dirX /= len; dirZ /= len;
    const camTarget = [x + dirX * 2, POV_EYE_HEIGHT - 0.05, z + dirZ * 2];
    return { id: p.id, label: p.label, image: p.image, camPos, camTarget };
  });
}

/* ============================================================================
   ALLER VERS UN POV → ANIMATION CAMÉRA EN VUE 1ÈRE PERSONNE

function goToPOI(poiId) {
  if (!propertyData || isAnimating) return;

  //  fait désormais par le menu. Les photos restent accessibles via leur bouton

  enterFirstPerson(poi);

/* Ouvre directement la galerie photos plein écran d'une pièce depuis le menu

     souris, n'est pas proposée au tactile). Si la pièce n'a pas de photo, on retombe
     sur le POV pour ne pas laisser le tap sans effet.
   - Desktop / tablette : comportement d'origine inchangé → entrée en POV. */
function onPoiNameClick(poiId) {

/* Position de l'appareil photo + point regardé */
function poiCamPos(poi) {
  const a = poi.camPos || poi.position || [0, 1.6, 0];
  return new BABYLON.Vector3(a[0], a[1], a[2]);
}
function poiCamTarget(poi) {
  // camTarget explicite, sinon on regarde droit devant (vers le centre de l'appart)
  if (poi.camTarget) {
    return new BABYLON.Vector3(poi.camTarget[0], poi.camTarget[1], poi.camTarget[2]);
  }
  const p = poiCamPos(poi);
  const c = modelBounds ? modelBounds.center : BABYLON.Vector3.Zero();
  // direction horizontale vers le centre, à hauteur des yeux
  const dir = c.subtract(p);
  dir.y = 0;
  if (dir.lengthSquared() < 0.001) dir.set(0, 0, 1);
  dir.normalize();
  return p.add(dir.scale(2)); // un point 2m devant
}

/* Animation ArcRotateCamera vers la vue 1ère personne, puis rotation libre sur place */
/* Caméra panorama : pivote sur son propre axe (l'œil reste fixe, seul le regard tourne) */
function enterPanoramaCamera(eyePos, lookAt) {
  if (!fpCamera) {
    fpCamera = new BABYLON.UniversalCamera('fpCamera', eyePos.clone(), scene);
    fpCamera.minZ = 0.05;
    fpCamera.inertia = 0.35;             // faible inertie → la rotation s'arrête net quand le doigt/la souris s'arrête (plus de dérive)
    fpCamera.angularSensibility = 2000;  // rotation souris POV (diviseur ; plus bas = plus rapide) — un peu plus vive
    // Rotation TACTILE : gérée manuellement (voir enablePovTouchLook) pour que le
    // glissement d'UN doigt fasse tourner la vue dans les DEUX axes (gauche/droite
    // ET haut/bas). L'input tactile natif de Babylon ne gère bien que l'axe X, on
    // le retire donc pour éviter les conflits.
    try {
      if (fpCamera.inputs && fpCamera.inputs.attached && fpCamera.inputs.attached.touch) {
        fpCamera.inputs.removeByType('FreeCameraTouchInput');
      }
    } catch (e) { /* selon version Babylon, l'input peut porter un autre nom */ }
    fpCamera.speed = 0;                  // aucun déplacement
    fpCamera.keysUp = []; fpCamera.keysDown = []; fpCamera.keysLeft = []; fpCamera.keysRight = [];
    // Souris : seulement le clic gauche pour pivoter, aucune translation
    if (fpCamera.inputs && fpCamera.inputs.attached && fpCamera.inputs.attached.mouse) {
      fpCamera.inputs.attached.mouse.buttons = [0];
    }

    // ========== TRAITEMENT D'IMAGE IDENTIQUE EN VUE POV ==========
    // Le pipeline de compositing ('compositing') n'était attaché qu'à
    // l'ArcRotateCamera. En passant sur la fpCamera, la vue POV ne traversait plus
    // ce post-traitement → rendu plus sombre/contrasté et SANS bloom. On rattache
    // donc LE MÊME pipeline à la fpCamera : ACES, exposition, contraste, bloom,
    // vignette et netteté sont désormais strictement identiques dans les 2 vues.
    try {
      if (scene.postProcessRenderPipelineManager) {
        scene.postProcessRenderPipelineManager
          .attachCamerasToRenderPipeline('compositing', fpCamera);
      }
    } catch (e) {
      console.warn('⚠️ Compositing non rattaché à la fpCamera :', e.message);
    }

    // ========== OCCLUSION DE CONTACT (SSAO2) IDENTIQUE EN VUE POV ==========
    // Le SSAO2 n'était attaché qu'à l'ArcRotateCamera : en POV l'occlusion de
    // contact disparaissait (coins/jonctions non assombris → rendu plus « plat »).
    // On rattache le MÊME pipeline SSAO2 à la fpCamera, dans le même ordre que sur
    // la caméra principale (compositing puis ssao2), pour un rendu strictement
    // identique dans les 2 vues. L'exclusion des vitres reste globale (prepass).
    try {
      if (window.ssao2Pipeline && scene.postProcessRenderPipelineManager) {
        scene.postProcessRenderPipelineManager
          .attachCamerasToRenderPipeline('ssao2', fpCamera);
        console.log('✅ SSAO2 rattaché à la fpCamera (AO actif en POV)');
      }
    } catch (e) {
      console.warn('⚠️ SSAO2 non rattaché à la fpCamera :', e.message);
    }
  }
  fpCamera.position.copyFrom(eyePos);
  fpCamera.fov = CONFIG.firstPersonFovWide;

  // Calculer la direction vers lookAt et en déduire les rotations Euler
  const dir = lookAt.subtract(eyePos).normalize();
  // dir.x = sin(yaw) * cos(pitch)
  // dir.y = -sin(pitch)  (note: y positif = haut, pitch positif = regard vers bas)
  // dir.z = cos(yaw) * cos(pitch)
  const pitch = -Math.asin(BABYLON.Scalar.Clamp(dir.y, -0.999, 0.999)); // yaw négatif vers le bas
  const yaw = Math.atan2(dir.x, dir.z);
  fpCamera.rotation.x = pitch; // tangage
  fpCamera.rotation.y = yaw;   // lacet
  fpCamera.rotation.z = 0;      // roulis
  const fixedPitch = pitch;     // verrouiller le tangage immédiatement

  fpCamera.viewport = new BABYLON.Viewport(0, 0, 1, 1); // POV : plein écran (immersif, panneau en overlay)

  // ========== PANORAMIC (haut/bas/gauche/droite) avec garde-fou vertical ==========
  // On autorise le regard vers le haut et vers le bas, mais on empêche le
  // retournement complet (tête en bas) qui rend la vue illisible. Le pitch est
  // clampé en douceur entre presque -90° et +90°.
  if (fpPitchObserver) scene.onBeforeRenderObservable.remove(fpPitchObserver);
  const PITCH_MAX = Math.PI / 2 - 0.08; // ~85° vers le haut et vers le bas
  fpPitchObserver = scene.onBeforeRenderObservable.add(() => {
    if (fpCamera.rotation.x >  PITCH_MAX) fpCamera.rotation.x =  PITCH_MAX;
    if (fpCamera.rotation.x < -PITCH_MAX) fpCamera.rotation.x = -PITCH_MAX;
    fpCamera.rotation.z = 0; // jamais de roulis
  });

  camera.detachControl();
  scene.activeCamera = fpCamera;
  fpCamera.attachControl(document.getElementById('canvas'), true);

  // ========== POV EN GRAND ANGLE FIXE ==========
  // Vue POV toujours en grand angle (plus simple et plus lisible).
  fpCamera.fov = CONFIG.firstPersonFovWide;

  // Active la rotation tactile personnalisée (1 doigt = la vue suit le doigt dans
  // les deux axes), le pincement 2 doigts (zoom) et la molette (PC).
  enablePovZoom();
}

/* Borne le FOV de la caméra POV entre l'ouverture de base (zoom max) et le grand angle. */
function clampPovFov(v) {
  return BABYLON.Scalar.Clamp(v, CONFIG.firstPersonFov, CONFIG.firstPersonFovWide);
}

/* Active le zoom FOV en vue POV : molette (PC) et pincement 2 doigts (mobile).
   - Molette vers le haut / écarter les doigts  → on ZOOME (FOV diminue vers firstPersonFov)
   - Molette vers le bas  / rapprocher les doigts → on DÉZOOME (FOV augmente vers firstPersonFovWide, grand angle) */
function enablePovZoom() {
  const canvas = document.getElementById('canvas');
  disablePovZoom(); // garantit qu'on ne double pas les listeners

  // --- Molette (PC) ---
  povWheelObserver = (ev) => {
    if (!isFirstPerson || !fpCamera) return;
    ev.preventDefault();
    // deltaY > 0 = molette vers le bas = dézoom (grand angle) → FOV augmente
    const dir = ev.deltaY > 0 ? 1 : -1;
    fpCamera.fov = clampPovFov(fpCamera.fov + dir * CONFIG.povZoomStep);
  };
  canvas.addEventListener('wheel', povWheelObserver, { passive: false });

  // --- Tactile : 1 doigt = rotation (yaw + pitch), 2 doigts = pincement zoom ---
  const dist2 = (t) => {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  };
  // Sensibilité de la rotation tactile : radians par pixel de déplacement du doigt.
  // Plus la valeur est haute, plus la vue tourne vite. La vue "suit le doigt".
  const TOUCH_LOOK_SPEED = 0.0042;
  const PITCH_LIMIT = Math.PI / 2 - 0.08; // ~85° : empêche le retournement complet

  const onTouchStart = (ev) => {
    if (!isFirstPerson || !fpCamera) return;
    if (ev.touches.length === 1) {
      // Début d'un glissement à un doigt → on mémorise la position de départ.
      povPinchActive = false;
      povLookActive = true;
      povLastTouchX = ev.touches[0].clientX;
      povLastTouchY = ev.touches[0].clientY;
    } else if (ev.touches.length === 2) {
      // Deux doigts → pincement zoom, on suspend la rotation.
      povLookActive = false;
      povPinchActive = true;
      povPinchStartDist = dist2(ev.touches);
      povPinchStartFov = fpCamera.fov;
    }
  };

  const onTouchMove = (ev) => {
    if (!isFirstPerson || !fpCamera) return;

    // Rotation à un doigt : la vue suit le doigt (gauche/droite ET haut/bas).
    if (povLookActive && ev.touches.length === 1) {
      ev.preventDefault();
      const t = ev.touches[0];
      const dx = t.clientX - povLastTouchX;
      const dy = t.clientY - povLastTouchY;
      povLastTouchX = t.clientX;
      povLastTouchY = t.clientY;
      // Glisser vers la droite → la vue tourne vers la droite ; glisser vers le
      // haut → on lève la tête. (Signe choisi pour un rendu naturel "la vue suit".)
      fpCamera.rotation.y += dx * TOUCH_LOOK_SPEED;
      fpCamera.rotation.x += dy * TOUCH_LOOK_SPEED;
      // Garde-fou vertical : pas de retournement.
      if (fpCamera.rotation.x >  PITCH_LIMIT) fpCamera.rotation.x =  PITCH_LIMIT;
      if (fpCamera.rotation.x < -PITCH_LIMIT) fpCamera.rotation.x = -PITCH_LIMIT;
      fpCamera.rotation.z = 0;
      return;
    }

    // Pincement à deux doigts : zoom (FOV).
    if (povPinchActive && ev.touches.length === 2) {
      ev.preventDefault();
      const d = dist2(ev.touches);
      const delta = (d - povPinchStartDist) * CONFIG.povPinchSensitivity;
      fpCamera.fov = clampPovFov(povPinchStartFov - delta);
    }
  };

  const onTouchEnd = (ev) => {
    if (ev.touches.length === 0) {
      povLookActive = false;
      povPinchActive = false;
    } else if (ev.touches.length === 1) {
      // On repasse d'un pincement à un doigt : reprendre la rotation depuis ce doigt.
      povPinchActive = false;
      povLookActive = true;
      povLastTouchX = ev.touches[0].clientX;
      povLastTouchY = ev.touches[0].clientY;
    }
  };

  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: true });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });
  povTouchHandlers = { start: onTouchStart, move: onTouchMove, end: onTouchEnd };
}

/* Désactive le zoom FOV en POV (retire molette + tactile). Appelé à la sortie du POV. */
function disablePovZoom() {
  const canvas = document.getElementById('canvas');
  if (povWheelObserver) {
    canvas.removeEventListener('wheel', povWheelObserver, { passive: false });
    povWheelObserver = null;
  }
  if (povTouchHandlers) {
    canvas.removeEventListener('touchstart', povTouchHandlers.start, { passive: false });
    canvas.removeEventListener('touchmove', povTouchHandlers.move, { passive: false });
    canvas.removeEventListener('touchend', povTouchHandlers.end, { passive: true });
    canvas.removeEventListener('touchcancel', povTouchHandlers.end, { passive: true });
    povTouchHandlers = null;
  }
  povPinchActive = false;
}

/* Restaure l'ArcRotateCamera en l'alignant sur la vue actuelle du panorama (transition douce) */
function exitPanoramaCamera() {
  disablePovZoom(); // retire la molette + le pincement liés au POV
  if (fpPitchObserver) { scene.onBeforeRenderObservable.remove(fpPitchObserver); fpPitchObserver = null; }
  if (fpCamera) {
    const fwd = fpCamera.getForwardRay().direction;
    const lookPoint = fpCamera.position.add(fwd.scale(2));
    camera.setTarget(lookPoint);
    camera.setPosition(fpCamera.position.clone());
    fpCamera.detachControl();
  }
  scene.activeCamera = camera;
  camera.attachControl(document.getElementById('canvas'), true);
}

function enterFirstPerson(poi) {
  if (isAnimating) return;
  isAnimating = true;
  isTopView = false;
  isFirstPerson = true;
  currentPoiId = poi.id;
  setHudVisible(false); // masque le HUD plan si on partait de la vue de dessus

  // Stopper tout observer d'animation en cours
  if (currentAnimObserver) {
    scene.onBeforeRenderObservable.remove(currentAnimObserver);
    currentAnimObserver = null;
  }

  camera.detachControl();
  camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;

  // Masquer les marqueurs pendant qu'on est immergé dans la pièce
  setMarkersVisible(false);

  const camPos = poiCamPos(poi);
  const lookAt = poiCamTarget(poi);

  // ArcRotateCamera : la cible = point regardé, le radius petit = on est "à" camPos.
  // On calcule alpha/beta/radius pour que la caméra soit à camPos en visant lookAt.
  const offset = camPos.subtract(lookAt);
  const targetRadius = Math.max(offset.length(), 0.4);
  // alpha/beta depuis l'offset (convention Babylon ArcRotate)
  const targetBeta = Math.acos(BABYLON.Scalar.Clamp(offset.y / targetRadius, -1, 1));
  const targetAlpha = Math.atan2(offset.z, offset.x);

  // États de départ
  const startTarget = camera.target.clone();
  const startRadius = camera.radius;
  const startAlpha = camera.alpha;
  const startBeta = camera.beta;
  const startVp = getEffectiveViewportWidthAtStart();
  const targetVp = 1; // POV = plein écran (offset écran ramené à 0)
  const startFov = camera.fov;
  // On anime directement vers le GRAND ANGLE (firstPersonFovWide), la valeur finale
  // de la caméra POV. Ainsi l'élargissement du champ se fait EN MÊME TEMPS que le vol
  // de caméra, et le passage sur la caméra POV (même FOV) est invisible — plus de
  // bascule brutale en grand angle à l'arrivée.
  const targetFov = CONFIG.firstPersonFovWide;

  // Délier temporairement les limites de zoom pour permettre le rapprochement
  camera.lowerRadiusLimit = null;
  camera.upperRadiusLimit = null;
  camera.lowerBetaLimit = 0.01;
  camera.upperBetaLimit = Math.PI - 0.01;

  const totalFrames = 100;
  let frame = 0;

  currentAnimObserver = scene.onBeforeRenderObservable.add(() => {
    frame++;
    const t = Math.min(frame / totalFrames, 1);
    const eased = easeInOut(t);

    const vpNow = startVp + (targetVp - startVp) * eased;
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);
    if (camera.targetScreenOffset) camera.targetScreenOffset.x = computeScreenShiftX(vpNow, camera);
    camera.target = BABYLON.Vector3.Lerp(startTarget, lookAt, eased);
    camera.radius = startRadius + (targetRadius - startRadius) * eased;
    camera.alpha = startAlpha + (targetAlpha - startAlpha) * eased;
    camera.beta = startBeta + (targetBeta - startBeta) * eased;
    camera.fov = startFov + (targetFov - startFov) * eased;

    if (t >= 1) {
      scene.onBeforeRenderObservable.remove(currentAnimObserver);
      currentAnimObserver = null;
      isAnimating = false;

      // Bascule sur une caméra "tête" qui pivote sur son propre axe (vrai panorama sur place)
      enterPanoramaCamera(camPos, lookAt);

      showFirstPersonPhoto(poi);
      flashLookHint();
      updateToggleButton();
      console.log('✅ Vue 1ère personne :', poi.id);
    }
  });
}

/* Re-render le panneau POV si la pièce qui vient de charger est celle du POV
   courant → le switch « Éléments de la pièce » passe de « chargement… » à actif,
   sans devoir ressortir puis revenir dans le POV. */
function refreshFirstPersonPanelIfRoom(roomId) {
  if (!isFirstPerson || !currentPoiId) return;
  const poi = (propertyData && propertyData.poi ? propertyData.poi : [])
                .find(p => p.id === currentPoiId);
  if (!poi) return;
  const poiRoomId = poi.roomId || poi.id;
  if (poiRoomId === roomId) showFirstPersonPhoto(poi);
}

/* Panneau en mode POV : éléments de LA pièce (activables) + description + photos vendeur + autres POV */
function showFirstPersonPhoto(poi) {
  // Ouvrir le panneau s'il est fermé — SAUF sur mobile, où le panneau est en overlay
  // plein écran : l'ouvrir automatiquement masquerait la pièce qu'on vient d'atteindre
  // et empêcherait de regarder autour tout de suite. Sur mobile, l'utilisateur ouvre
  // les infos via la flèche quand il le souhaite ; le contenu est tout de même préparé.
  const isMobile = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  if (!isPoiPanelOpen && !isMobile) togglePoiPanel();

  const panel = document.getElementById('poi-panel');
  const baseUrl = CONFIG.assetsBase(CONFIG.propertyId);

  // --- Pièce associée à ce POV (roomId explicite, sinon même id que le POV) ---
  const roomId = poi.roomId || poi.id;
  const room = roomList.find(r => r.id === roomId);
  const rst = room ? roomState[room.id] : null;
  const roomLoaded = !!(rst && rst.loaded && !rst.failed);

  // Auto-activer les éléments de la pièce visitée (si configuré)
  if (room && roomLoaded && CONFIG.autoEnableRoomOnPOV) {
    rst.enabled = true;
    if (roomNodes[room.id]) roomNodes[room.id].setEnabled(true);
  }

  // --- Section « Éléments de la pièce » (switch unique pour cette pièce) ---
  // Téléphone : retirée. C'est un réglage fin qui n'a pas sa place sur un écran
  // où chaque ligne compte ; les éléments restent dans l'état par défaut.
  let roomToggleHTML = '';
  if (room && !isPhoneUI()) {
    const checked  = (rst && rst.enabled) ? 'checked' : '';
    const disabled = roomLoaded ? '' : 'disabled';
    const status   = (rst && rst.failed) ? '<span class="room-status">indispo.</span>'
                   : (!roomLoaded ? '<span class="room-status">chargement…</span>' : '');
    roomToggleHTML = `
      <div class="room-section">
        <div class="room-section-head">
          <h4 class="room-section-title">Éléments de la pièce</h4>
        </div>
        <div class="room-row">
          <span><span class="room-name">${poiLabel(room)}</span>${status}</span>
          <label class="switch">
            <input type="checkbox" ${checked} ${disabled}
                   onchange="toggleRoom('${room.id}', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>`;
  }

  // --- Description ---
  const descHTML = poi.description ? `
    <div class="fp-desc">
      <div class="fp-section-title">Description</div>
      <p>${poi.description}</p>
    </div>` : '';

  // --- Photos vendeur : poi.photos (tableau) sinon poi.image (unique) ---
  let photos = [];
  if (Array.isArray(poi.photos) && poi.photos.length) photos = poi.photos;
  else if (poi.image) photos = [poi.image];

  const photosHTML = photos.length ? `
    <div class="fp-photos">
      <div class="fp-section-title">Photos</div>
      ${photos.map((img, idx) => {
        const src = baseUrl + encodeURIComponent(img) + '?v=' + CONFIG.photoVersion;
        // Stocke le tableau global une fois, puis juste passe l'index à onclick
        return `<div class="fp-photo-frame" onclick="openLightboxFromGallery(${idx})">
                  <img src="${src}" alt="${poi.label || ''}">
                </div>`;
      }).join('')}
      ${isPhoneUI() ? '' : `<div class="fp-photo-hint">Cliquez sur une photo pour l'agrandir.</div>`}
    </div>` : '';
  
  // Pré-charge le tableau de photos globales pour la lightbox
  poiPhotosGallery = photos.map(img => baseUrl + encodeURIComponent(img) + '?v=' + CONFIG.photoVersion);

  // --- Toutes les pièces (switcher sans quitter 1ère personne) ---
  // Ordre fixe (celui du manifest) ; le POV actif reste à sa place, désactivé et coloré.

/* ====== LIGHTBOX AVEC NAVIGATION PHOTOS ====== */
function openLightboxFromGallery(index) {
  // Ouvre la lightbox avec le tableau global de photos du POI
  if (poiPhotosGallery.length > 0) {
    openLightbox(poiPhotosGallery[index], poiPhotosGallery, index);
  }
}

/* MOBILE — Concept POV repensé pour le téléphone.
   La vue 1ère personne est calibrée pour ordinateur (souris) : sur téléphone la
   rotation tactile ne fonctionne pas et le cadrage est illisible. On remplace donc
   l'immersion POV par l'affichage DIRECT des photos du point de vue, en plein écran
   (lightbox existante : lisible, glissable, navigation avant/arrière).
   Retourne false si le POV n'a aucune photo (pour laisser un éventuel repli). */
function openPoiPhotosMobile(poi) {
  const baseUrl = CONFIG.assetsBase(CONFIG.propertyId);
  let photos = [];
  if (Array.isArray(poi.photos) && poi.photos.length) photos = poi.photos;
  else if (poi.image) photos = [poi.image];
  if (!photos.length) return false;
  // encodeURIComponent : les noms accentués/majuscules (ex: « Entrée_01.png ») sont
  // correctement encodés pour l'URL. N'altère pas les noms simples déjà valides.
  const urls = photos.map(img => baseUrl + encodeURIComponent(img) + '?v=' + CONFIG.photoVersion);
  poiPhotosGallery = urls;
  // Marque le POV actif dans la liste
  document.querySelectorAll('.poi-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('poi-' + poi.id);
  if (btn) btn.classList.add('active');
  openLightbox(urls[0], urls, 0);
  return true;
}

function openLightbox(src, photoArray = null, index = 0) {
  // Si un tableau de photos est passé, on permet la navigation
  if (Array.isArray(photoArray) && photoArray.length > 0) {
    currentPhotos = photoArray;
    currentPhotoIndex = Math.max(0, Math.min(index, photoArray.length - 1));
    displayPhoto(currentPhotoIndex);
    
    // Affiche nav que si > 1 photo
    const nav = document.getElementById('lightbox-nav');
    if (photoArray.length > 1) {
      nav.style.display = 'flex';
      document.getElementById('lightbox-total').textContent = photoArray.length;
    } else {
      nav.style.display = 'none';
    }
  } else {
    // Fallback : image unique, pas de navigation
    currentPhotos = [];
    currentPhotoIndex = 0;
    lightboxImgOk();
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-nav').style.display = 'none';
  }
  
  document.getElementById('lightbox').classList.remove('hidden');
}

function displayPhoto(index) {
  if (index < 0 || index >= currentPhotos.length) return;
  currentPhotoIndex = index;
  lightboxImgOk(); // repart d'un état sain avant chargement
  document.getElementById('lightbox-img').src = currentPhotos[index];
  document.getElementById('lightbox-index').textContent = index + 1;
}

function nextPhoto() {
  if (currentPhotos.length > 1) {
    displayPhoto((currentPhotoIndex + 1) % currentPhotos.length);
  }
}

function prevPhoto() {
  if (currentPhotos.length > 1) {
    displayPhoto((currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length);
  }
}

function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  currentPhotos = [];
}

/* Repli si une photo ne se charge pas (404, nom de fichier incorrect, etc.) :
   on affiche un message lisible au lieu d'un écran noir vide. */
function lightboxImgError() {
  const img = document.getElementById('lightbox-img');
  const err = document.getElementById('lightbox-error');
  if (img) img.style.visibility = 'hidden';
  if (err) err.classList.remove('hidden');
}
function lightboxImgOk() {
  const img = document.getElementById('lightbox-img');
  const err = document.getElementById('lightbox-error');
  if (img) img.style.visibility = 'visible';
  if (err) err.classList.add('hidden');
}

/* ============================================================================
   SKYBOX NOIR → BLANC (éclairage avec variations, pas plat)
   ============================================================================ */
function createGradientSkybox() {
  // Sphère géante pour la skybox
  const skybox = BABYLON.MeshBuilder.CreateSphere('skybox', { diameter: 2000, segments: 64 }, scene);
  
  // Créer une texture dégradée noir (bas) → blanc (haut)
  const gradientTexture = new BABYLON.DynamicTexture('skyboxGradient', 512, scene);
  const ctx = gradientTexture.getContext();
  
  // Dégradé noir (bas) → blanc (haut)
  const gradient = ctx.createLinearGradient(0, 512, 0, 0);  // De bas en haut
  gradient.addColorStop(0, '#000000');    // Noir en bas
  gradient.addColorStop(0.5, '#404040');  // Gris foncé au milieu
  gradient.addColorStop(1, '#ffffff');    // Blanc en haut
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 512);
  gradientTexture.update();
  
  // Matériau pour la skybox (émet de la lumière, pas de réflexion)
  const skyMaterial = new BABYLON.StandardMaterial('skyboxMaterial', scene);
  skyMaterial.emissiveTexture = gradientTexture;
  skyMaterial.backFaceCulling = false;
  skyMaterial.disableLighting = true;
  
  skybox.material = skyMaterial;
  skybox.infiniteDistance = true;  // Suit la caméra
  
  console.log('✅ Skybox noir→blanc créée (éclairage avec variations)');
}

/* ============================================================================
   HDRI ENVIRONNEMENT (non-bloquant) — éclairage réaliste sur matériaux PBR des GLB
   ============================================================================ */
function setupHDRI() {
  const hdriUrl = 'Hdri_Viewer_3D.hdr';
  console.log('💡 Chargement HDRi:', hdriUrl);
  try {
    const hdrTexture = new BABYLON.HDRCubeTexture(hdriUrl, scene, 512);
    hdrTexture.onLoadObservable.add(() => {
      scene.environmentTexture = hdrTexture;
      scene.environmentIntensity = 3.5;  // Augmenté pour vraiment voir l'effet HDRi
      console.log('✅ HDRi appliquée (IBL) - éclairage réaliste');
    });
    // En cas d'échec, on ne touche pas à la scène (elle reste éclairée par les lumières de base)
    if (hdrTexture.onErrorObservable) {
      hdrTexture.onErrorObservable.add((e) => console.warn('⚠️ Échec HDRi, lumières de base conservées:', e));
    }
  } catch (e) {
    console.warn('⚠️ HDRi non chargée (exception), lumières de base conservées:', e);
  }
}

/* ============================================================================
   CRÉER LES MARQUEURS POV (taille écran constante, cliquables)
   ============================================================================ */
const POI_MARKER_SCREEN_SIZE = 0.0065; // taille apparente à l'écran (2x plus petit)
// Pastilles un peu plus grandes sur tablette/téléphone (cibles tactiles plus faciles).
const POI_MARKER_TOUCH_BOOST = 2.0;
const _poiTouchMQL = (typeof window !== 'undefined' && window.matchMedia)
  ? window.matchMedia('(max-width: 1200px)') : null;
function poiMarkerScreenSize() {
  return POI_MARKER_SCREEN_SIZE * ((_poiTouchMQL && _poiTouchMQL.matches) ? POI_MARKER_TOUCH_BOOST : 1);
}
const POI_MARKER_COLOR = (window.__BRAND__ && window.__BRAND__.navy) || '#0B1B3F';    // couleur du marqueur POV = bleu du header (mets '#0046FE' pour le bleu accent, plus vif)

function createPoiMarkers() {
  if (!propertyData || !propertyData.poi) return;

  // Nettoyer d'éventuels anciens marqueurs
  Object.values(poiMarkers).forEach(m => {
    if (m.observer) scene.unregisterBeforeRender(m.observer);
    if (m.plane) m.plane.dispose();
    if (m.group) m.group.dispose();
  });
  poiMarkers = {};

  const pois = propertyData.poi || [];
  console.log('📍 Création marqueurs POV pour', pois.length, 'POI');

  // Marqueur POV : anneau généré en procédural à la couleur POI_MARKER_COLOR
  // (fond transparent). Indépendant de pov.png → couleur garantie, aucun souci de
  // chargement/affichage de texture (fini le damier).
  const base = CONFIG.assetsBase(CONFIG.propertyId);
  const ringTex = new BABYLON.DynamicTexture('poi-ring', 256, scene, true);
  ringTex.hasAlpha = true;
  const rctx = ringTex.getContext();
  rctx.clearRect(0, 0, 256, 256);
  
  // Convertir la couleur hex en RGB pour Canvas (qui n'accepte pas le hex directement)
  const hexToRgb = (hex) => {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `rgb(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)})` : 'blue';
  };
  const colorRgb = hexToRgb(POI_MARKER_COLOR);
  
  rctx.lineWidth = 26;
  rctx.strokeStyle = colorRgb;     // anneau
  rctx.beginPath();
  rctx.arc(128, 128, 92, 0, Math.PI * 2);
  rctx.stroke();
  rctx.fillStyle = colorRgb;       // point central
  rctx.beginPath();
  rctx.arc(128, 128, 20, 0, Math.PI * 2);
  rctx.fill();
  ringTex.update();

  pois.forEach(poi => {
    // L'ancre du marqueur = camPos si défini, sinon position (rétro-compat)
    const anchor = poi.camPos || poi.position;
    if (!anchor) {
      console.warn('⚠️ POI sans camPos/position:', poi.id);
      return;
    }
    const [x, y, z] = anchor;

    const markerGroup = new BABYLON.TransformNode('poi-group-' + poi.id, scene);
    markerGroup.position = new BABYLON.Vector3(x, y, z);

    const markerPlane = BABYLON.MeshBuilder.CreatePlane('poi-plane-' + poi.id, {
      size: 1,
      sideOrientation: BABYLON.Mesh.DOUBLESIDE
    }, scene);
    markerPlane.parent = markerGroup;
    markerPlane.position = BABYLON.Vector3.Zero();
    // Billboard automatique : le plan fait toujours face à la caméra 
    markerPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

    const poiMat = new BABYLON.StandardMaterial('mat-poi-' + poi.id, scene);
    poiMat.diffuseTexture = ringTex;
    poiMat.emissiveTexture = ringTex;           // rendu lumineux → toujours bien visible
    poiMat.useAlphaFromDiffuseTexture = true;   // transparence depuis la texture
    poiMat.emissiveColor = new BABYLON.Color3(1, 1, 1); // couleur déjà dans l'anneau
    poiMat.disableLighting = true;
    poiMat.backFaceCulling = false;
    markerPlane.material = poiMat;

    markerPlane.isPickable = true;
    markerPlane.poiId = poi.id;
    // Sur téléphone : masqué et non-cliquable dès la création (aucune interaction 3D).
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
      markerPlane.setEnabled(false);
    }
    // Toujours rendu par-dessus la géométrie pour rester cliquable même derrière un mur proche
    markerPlane.renderingGroupId = 1;

    // Taille écran constante : on compense la distance caméra à chaque frame
    const sizeObserver = scene.registerBeforeRender(() => {
      if (!camera) return;
      const dist = BABYLON.Vector3.Distance(camera.position, markerGroup.position);
      const refRadius = (initialFraming && initialFraming.radius) ? initialFraming.radius : 10;
      // échelle proportionnelle à la distance => taille apparente stable
      const scale = dist * poiMarkerScreenSize() * (refRadius / 10);
      markerPlane.scaling.set(scale, scale, scale);
    });

    poiMarkers[poi.id] = {
      group: markerGroup,
      plane: markerPlane,
      observer: sizeObserver
    };
  });

  console.log('✅ Marqueurs POV créés :', Object.keys(poiMarkers).length);
}

function setMarkersVisible(visible) {
  // Sur TÉLÉPHONE : jamais de pastilles dans le viewer 3D (trop petites, cassent la
  // lecture). L'accès aux pièces se fait uniquement via le menu déroulant. Le viewer
  // reste dédié à la navigation et à la vue de dessus (cotations). Aucune autre
  // interaction dans la scène. Tablette et desktop : comportement inchangé.
  const phone = window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  if (phone) visible = false;
  Object.values(poiMarkers).forEach(m => {
    if (m.plane) m.plane.setEnabled(visible);
  });
}

/* ============================================================================
   ANIMATION VERS VUE DE DESSUS (PERSPECTIVE)
   ============================================================================ */
function playTopViewAnimation() {
  if (!initialFraming || isAnimating) return;
  isAnimating = true;

  // Si on partait d'une vue 1ère personne, restaurer l'état "visite"
  if (isFirstPerson) {
    exitPanoramaCamera();               // rebascule sur l'ArcRotate, alignée sur la vue panorama
    isFirstPerson = false;
    currentPoiId = null;
    setMarkersVisible(true);
    rebuildPoiList();
    camera.panningSensibility = 300;    // translation au clic droit réactivée
    camera.angularSensibilityX = 1000;  // vitesse de rotation de navigation
    camera.angularSensibilityY = 1000;
  }

  // Stopper tout observer en cours (sécurité anti-conflit)
  if (currentAnimObserver) {
    scene.onBeforeRenderObservable.remove(currentAnimObserver);
    currentAnimObserver = null;
  }

  // Détacher les contrôles dès le départ : pas d'interaction pendant la montée
  camera.detachControl();

  // Libérer les limites de zoom (en 1ère personne elles bloquent le radius)
  camera.lowerRadiusLimit = null;
  camera.upperRadiusLimit = null;

  // (la cible est recentrée en douceur dans la boucle d'animation ci-dessous)

  // S'assurer qu'on est en perspective pour l'animation
  camera.mode = BABYLON.Camera.PERSPECTIVE_CAMERA;
  camera.upperBetaLimit = Math.PI / 2 + 0.15;
  camera.lowerBetaLimit = 0.001;

  const finalBeta = 0.001; // ~0° = directement au-dessus (vraie vue top)
  const finalAlpha = -Math.PI / 2; // Centré

  // États de départ
  const startViewportWidth = getEffectiveViewportWidthAtStart();
  const targetViewportWidth = getEffectiveViewportWidth(); // Considère l'état du panneau
  const startRadius = camera.radius;
  const startBeta = camera.beta;
  const startAlpha = wrapAlphaNear(camera.alpha, finalAlpha);
  const startFov = camera.fov;
  // Cible de départ (potentiellement décalée par une translation) → on l'interpole
  // en douceur vers le centre du modèle pour TOUJOURS recadrer, sans saut.
  const startTarget = camera.target.clone();
  const targetCenter = modelBounds ? modelBounds.center.clone() : camera.target.clone();

  const totalFrames = 120;
  let frame = 0;

  currentAnimObserver = scene.onBeforeRenderObservable.add(() => {
    frame++;
    const t = Math.min(frame / totalFrames, 1);
    const eased = easeInOut(t);

    // Rendu plein écran ; le décalage écran glisse vers la zone gauche
    const vpWidth = startViewportWidth + (targetViewportWidth - startViewportWidth) * eased;
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);

    // Cible recentrée progressivement (corrige toute translation préalable)
    camera.target = BABYLON.Vector3.Lerp(startTarget, targetCenter, eased);

    // Beta + alpha interpolés manuellement
    camera.beta = startBeta + (finalBeta - startBeta) * eased;
    camera.alpha = startAlpha + (finalAlpha - startAlpha) * eased;
    camera.fov = startFov + (defaultFov - startFov) * eased;

    // Radius recalculé pour la largeur utile courante (cadrage continu)
    const targetRadius = computeTopViewRadiusForViewport(vpWidth);
    camera.radius = startRadius + (targetRadius - startRadius) * eased;
    if (camera.targetScreenOffset) camera.targetScreenOffset.x = computeScreenShiftX(vpWidth, camera);

    if (t >= 1) {
      scene.onBeforeRenderObservable.remove(currentAnimObserver);
      currentAnimObserver = null;
      camera.fov = defaultFov;
      camera.target = targetCenter.clone(); // verrouille le centre exact
      // État final verrouillé (caméra reste détachée)
      isAnimating = false;
      isTopView = true;
      updateToggleButton();
      setHudVisible(true); // affiche le HUD plan (cotations + pièces)
  if (EDIT_MODE) showTopViewZoomCtrl(true);
      setTimeout(() => { flashTopViewHint(); }, 300);
      console.log('✅ Vue de dessus — clique le bouton pour revenir en navigation');
    }
  });
}

/* Bouton bascule : alterne entre vue de dessus et navigation */
function toggleViewMode() {
  if (isAnimating) return; // ignore les clics pendant une transition
  if (isTopView) {
    resetView();            // → revient en navigation
  } else {
    playTopViewAnimation(); // → monte en vue de dessus
  }
}

/* Met à jour le libellé du bouton selon le mode courant */
/* Icônes SVG en currentColor (blanc sur le bouton) */
const ICON_TOPVIEW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg>`;

const ICON_NAV = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M5 7a9 9 0 0 1 14 1"/><polyline points="19 4 19.5 8.5 15 8"/><path d="M19 17a9 9 0 0 1-14-1"/><polyline points="5 20 4.5 15.5 9 16"/></svg>`;

function updateToggleButton() {
