// Courbe d'easing identique à CubicEase EASEINOUT
function easeInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ============================================================================
   HUD PLAN — COTATIONS + NOMS DE PIÈCES (vue de dessus)
   Calque SVG superposé. Projette le 3D → écran à chaque frame tant qu'il est
   visible. 1ère étape : cotation GLOBALE de l'appart (largeur + profondeur) avec
   lignes d'attache + ticks aux deux extrémités, et nom de chaque pièce en son centre.
   ============================================================================ */
const HUD = {
  enabled: true,
  // Affichage des cotes : world units → unité affichée. Modèle en mètres par défaut.
  unitScale: 1, unitSuffix: ' m', unitDecimals: 2,
  // Géométrie des cotations (en pixels écran)
  dimOffset: 170,    // distance de la cote GLOBALE (extérieure) à la cage du GLB
  segOffset: 110,     // distance de la chaîne SEGMENTÉE (intérieure, par mur)
  roomDimOffset: 36, // distance des cotes au contour d'une pièce isolée (plus serré)
  dimExt: 7,         // dépassement des lignes d'attache au-delà de la ligne de cote
  dimTick: 7,        // longueur des ticks (chanfreins) aux extrémités
  // Côtés sur lesquels on garde EN PLUS la cote globale quand une chaîne segmentée existe
  globalSides: ['top', 'left'],
  // Couleurs (identité Laforêt)
  navy: '#ffffff', accent: '#ffffff', halo: 'transparent',
  roomColor: (window.__BRAND__ && window.__BRAND__.accent) || '#0046FE',   // couleur des NOMS de pièces sur le plan (bleu Laforêt)
  dimFont: 12, roomFont: 14,
  // Isolation de pièce (vue de dessus) : assombrissement des autres pièces
  maskColor: (window.__BRAND__ && window.__BRAND__.navy) || '#0B1B3F', maskOpacity: 0.5,
};
let hudVisible = false;
let hudObserver = null;
let hudScale = 1; // facteur d'échelle des cotations/libellés (responsive)

// Navigation dans la lightbox photo
let currentPhotos = [];     // tableau des URLs des photos du POI actuel
let currentPhotoIndex = 0;  // index de la photo affichée
let poiPhotosGallery = []; // photos du POI actuel (stockées pour la lightbox)

/* Échelle du HUD proportionnelle à la hauteur réelle de la zone de rendu (CSS px).
   Référence ~1250px : sur un écran courant l'échelle vaut ~1 → cotations de la
   MÊME taille qu'avant le responsive. Elles grandissent doucement en 4K et
   rapetissent sur mobile, sans jamais devenir envahissantes. */
function computeHudScale() {
  const cv = document.getElementById('canvas');
  const h = cv ? cv.clientHeight : window.innerHeight;
  return Math.max(0.75, Math.min(2.2, h / 1250));
}

/* Facteur appliqué aux DISTANCES des cotations (en px) sur écran étroit : sur
   téléphone les lignes de cote sont dessinées à offset fixe en pixels, ce qui les
   fait sortir du cadre. On resserre l'offset proportionnellement à la largeur —
   SANS toucher à la taille des libellés (lisibilité préservée). Desktop = 1. */
function hudOffsetFactor() {
  const cv = document.getElementById('canvas');
  const w = cv ? cv.clientWidth : window.innerWidth;
  if (w >= 900) return 1;
  return Math.max(0.34, w / 900);
}
let hudIsolatedRoom = null; // pièce actuellement isolée (objet {label, world, rect})

/* Projette une position monde → coordonnées écran CSS (px), en tenant compte du
   viewport décalé de la caméra (panneau de droite). */
function hudProject(world) {
  const w = engine.getRenderWidth(), h = engine.getRenderHeight();
  const vp = (scene.activeCamera || camera).viewport.toGlobal(w, h);
  const p = BABYLON.Vector3.Project(
    world, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), vp);
  const cv = document.getElementById('canvas');
  return { x: p.x * (cv.clientWidth / w), y: p.y * (cv.clientHeight / h) };
}

/* Inverse de hudProject, valable en vue de dessus (projection affine).
   On sonde 3 points connus et on retourne le systeme 2x2 : aucune dependance
   aux conventions internes de Babylon (scaling materiel, viewport...). */
function hudUnproject(px, py) {
  if (!modelBounds) return null;
  const yF = modelBounds.min.y;
  const O  = hudProject(new BABYLON.Vector3(0, yF, 0));
  const X  = hudProject(new BABYLON.Vector3(1, yF, 0));
  const Z  = hudProject(new BABYLON.Vector3(0, yF, 1));
  const a  = { x: X.x - O.x, y: X.y - O.y };     // ecran par unite de monde X
  const b  = { x: Z.x - O.x, y: Z.y - O.y };     // ecran par unite de monde Z
  const d  = { x: px  - O.x, y: py  - O.y };
  const det = a.x * b.y - a.y * b.x;
  if (Math.abs(det) < 1e-9) return null;          // degenere (pas en vue de dessus)
  return new BABYLON.Vector3(
    (d.x * b.y - d.y * b.x) / det, yF,
    (a.x * d.y - a.y * d.x) / det
  );
}

function hudFormat(worldLen) {
  return (worldLen * HUD.unitScale).toFixed(HUD.unitDecimals).replace('.', ',') + HUD.unitSuffix;
}

/* Centre (X,Z) d'une pièce à partir de son node de meubles (marche même masqué). */
function hudRoomCenter(node) {
  const r = hudRoomRect(node);
  if (!r) return null;
  return new BABYLON.Vector3((r[0] + r[2]) / 2, r[4], (r[1] + r[3]) / 2);
}

/* Emprise au sol [xMin, zMin, xMax, zMax] (+ yFloor en [4]) d'un node de meubles. */
function hudRoomRect(node) {
  let min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
  let max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
  let found = false;
  node.getChildMeshes(false).forEach(m => {
    if (!m.getTotalVertices || m.getTotalVertices() === 0) return;
    m.computeWorldMatrix(true);
    const bb = m.getBoundingInfo().boundingBox;
    min = BABYLON.Vector3.Minimize(min, bb.minimumWorld);
    max = BABYLON.Vector3.Maximize(max, bb.maximumWorld);
    found = true;
  });
  if (!found) return null;
  return [min.x, min.z, max.x, max.z, min.y];
}

/* Normalise un rect manifest [a,b,c,d] → [xMin,zMin,xMax,zMax]. */
function hudNormRect(c) {
  if (!Array.isArray(c) || c.length < 4) return null;
  return [Math.min(c[0], c[2]), Math.min(c[1], c[3]), Math.max(c[0], c[2]), Math.max(c[1], c[3])];
}

/* Liste {label, world, rect?, id?} des pièces à étiqueter.
   Priorité 1 : manifest.json > "roomLabels" (nom + coords + bounds optionnels).
   Priorité 2 : centres des nodes de meubles (roomNodes) + libellés roomList.
   Priorité 3 : POI du manifest. */
function hudRoomLabels() {
  // --- 1) Déclaré dans le manifest (comme les POV) ---
  const declared = propertyData && Array.isArray(propertyData.roomLabels)
    ? propertyData.roomLabels : null;
  if (declared && declared.length) {
    const yFloor = modelBounds ? modelBounds.min.y : 0;
    const out = [];
    declared.forEach(r => {
      const name = planLabel(r);
      // Coordonnées acceptées : position/coords/xz = [x,z] ou [x,y,z], ou champs x/y/z
      const c = r.position || r.coords || r.xz;
      let x, y, z;
      if (Array.isArray(c)) {
        if (c.length >= 3) { x = c[0]; y = c[1]; z = c[2]; }
        else { x = c[0]; z = c[1]; }
      } else {
        x = r.x; y = r.y; z = r.z;
      }
      if (x == null || z == null) return; // entrée incomplète → ignorée
      // Emprise (pour l'isolation) : bounds/rect manifest, sinon node de meubles
      let rect = hudNormRect(r.bounds || r.rect);
      if (!rect && r.id && roomNodes[r.id]) { const rr = hudRoomRect(roomNodes[r.id]); if (rr) rect = rr; }
      out.push({ label: name, id: r.id, rect, ref: r,
                 style: { color: r.color || null, size: r.fontSize || null },
                 world: new BABYLON.Vector3(x, (y != null ? y : yFloor), z) });
    });
    if (out.length) return out;
  }

  // --- 2) Centres des meubles + libellés roomList ---
  const out = [];
  if (roomList && roomList.length) {
    roomList.forEach(r => {
      const node = roomNodes[r.id];
      if (!node) return;
      const rect = hudRoomRect(node);
      const c = hudRoomCenter(node);
      if (c) out.push({ label: poiLabel(r), id: r.id, rect, world: c });
    });
  }
  // --- 3) Repli : POI ---
  if (!out.length && propertyData && Array.isArray(propertyData.poi)) {
    const y = modelBounds ? modelBounds.min.y : 0;
    propertyData.poi.forEach(p => {
      const pos = p.camPos || p.position;
      if (!pos) return;
      out.push({ label: poiLabel(p), id: p.id, rect: null, world: new BABYLON.Vector3(pos[0], y, pos[2]) });
    });
  }
  return out;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* Dessine une cotation entre 2 points écran e1,e2, décalée vers l'extérieur
   (normale n = vecteur unitaire pointant hors du modèle). */
function hudDimension(g, e1, e2, n, text, offParam) {
  const off = (offParam != null ? offParam : HUD.dimOffset) * hudScale,
        ext = HUD.dimExt * hudScale, tk = HUD.dimTick * hudScale;
  const d1 = { x: e1.x + n.x * off, y: e1.y + n.y * off };
  const d2 = { x: e2.x + n.x * off, y: e2.y + n.y * off };

  // Lignes d'attache (un trait à chaque mur : début et fin)
  [[e1, d1], [e2, d2]].forEach(([a, b]) => {
    g.appendChild(svgEl('line', {
      x1: a.x, y1: a.y, x2: b.x + n.x * ext, y2: b.y + n.y * ext,
      stroke: HUD.navy, 'stroke-width': 1, 'stroke-opacity': 0.55
    }));
  });

  // Ligne de cote principale
  g.appendChild(svgEl('line', {
    x1: d1.x, y1: d1.y, x2: d2.x, y2: d2.y,
    stroke: HUD.navy, 'stroke-width': 1.4
  }));

  // Ticks (chanfreins à 45°) aux deux extrémités
  const dir = { x: d2.x - d1.x, y: d2.y - d1.y };
  const len = Math.hypot(dir.x, dir.y) || 1;
  const u = { x: dir.x / len, y: dir.y / len };
  const slash = { x: (u.x + n.x) * tk, y: (u.y + n.y) * tk };
  [d1, d2].forEach(d => {
    g.appendChild(svgEl('line', {
      x1: d.x - slash.x, y1: d.y - slash.y, x2: d.x + slash.x, y2: d.y + slash.y,
      stroke: HUD.navy, 'stroke-width': 1.4
    }));
  });

  // Libellé de la cote, centré sur la ligne, légèrement décalé vers l'extérieur
  const mid = { x: (d1.x + d2.x) / 2 + n.x * 14 * hudScale, y: (d1.y + d2.y) / 2 + n.y * 14 * hudScale };
  let ang = Math.atan2(dir.y, dir.x) * 180 / Math.PI;
  if (ang > 90 || ang < -90) ang += 180; // garde le texte lisible
  const t = svgEl('text', {
    x: mid.x, y: mid.y, transform: `rotate(${ang} ${mid.x} ${mid.y})`,
    'text-anchor': 'middle', 'dominant-baseline': 'middle',
    'font-family': 'system-ui, sans-serif', 'font-size': HUD.dimFont * hudScale,
    'font-weight': 600, fill: HUD.accent,
    stroke: HUD.halo, 'stroke-width': 3 * hudScale, 'paint-order': 'stroke'
  });
  t.textContent = text;
  g.appendChild(t);
}

function hudRoomLabel(g, p, label, dim, style) {
  const col  = (style && style.color) || HUD.roomColor;   // surcharge manifest
  const size = (style && style.size)  || HUD.roomFont;    // surcharge manifest
  const t = svgEl('text', {
    x: p.x, y: p.y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
    'font-family': 'system-ui, sans-serif', 'font-size': size * hudScale,
    'font-weight': 700, 'letter-spacing': '0.04em',
    fill: col, stroke: HUD.halo, 'stroke-width': 3.5 * hudScale, 'paint-order': 'stroke',
    opacity: dim ? 0.4 : 1
  });
  t.textContent = (label || '').toUpperCase();
  g.appendChild(t);
  return t;
}

/* Projette un rect monde [xMin,zMin,xMax,zMax] (au sol y) → 4 coins écran {a,b,c,d}. */
function hudProjectRect(rect, y) {
  return {
    a: hudProject(new BABYLON.Vector3(rect[0], y, rect[1])),
    b: hudProject(new BABYLON.Vector3(rect[2], y, rect[1])),
    c: hudProject(new BABYLON.Vector3(rect[2], y, rect[3])),
    d: hudProject(new BABYLON.Vector3(rect[0], y, rect[3])),
  };
}

/* Chaîne de cotation SEGMENTÉE le long d'une arête monde Sworld→Eworld.
   segments = longueurs (m) cumulées depuis Sworld ; un trait d'attache + tick
   à chaque rupture de mur. Les breaks sont positionnés à la vraie distance réelle. */
function hudChain(g, Sworld, Eworld, n, segments, off) {
  const worldLen = BABYLON.Vector3.Distance(Sworld, Eworld) || 1;
  let cum = 0;
  let prevP = hudProject(Sworld);
  segments.forEach(seg => {
    cum += seg;
    const f = Math.min(cum / worldLen, 1);
    const wpt = BABYLON.Vector3.Lerp(Sworld, Eworld, f);
    const ppt = hudProject(wpt);
    hudDimension(g, prevP, ppt, n, hudFormat(seg), off);
    prevP = ppt;
  });
}

/* Cotation sur les 4 côtés d'un quad écran P={a,b,c,d}. */
function hudQuadDimensions(g, P, wText, dText, off) {
  const avgY = e => (e[0].y + e[1].y) / 2, avgX = e => (e[0].x + e[1].x) / 2;
  const eMinZ = [P.a, P.b], eMaxZ = [P.d, P.c];
  const top = avgY(eMinZ) <= avgY(eMaxZ) ? eMinZ : eMaxZ;
  const bottom = top === eMinZ ? eMaxZ : eMinZ;
  const eMinX = [P.a, P.d], eMaxX = [P.b, P.c];
  const left = avgX(eMinX) <= avgX(eMaxX) ? eMinX : eMaxX;
  const right = left === eMinX ? eMaxX : eMinX;
  hudDimension(g, top[0], top[1], { x: 0, y: -1 }, wText, off);
  hudDimension(g, bottom[0], bottom[1], { x: 0, y: 1 }, wText, off);
  hudDimension(g, left[0], left[1], { x: -1, y: 0 }, dText, off);
  hudDimension(g, right[0], right[1], { x: 1, y: 0 }, dText, off);
}

/* Masque sombre plein écran avec un trou sur le quad de la pièce active. */
function hudDrawMask(g, Q) {
  const cv = document.getElementById('canvas');
  const W = cv.clientWidth, H = cv.clientHeight;
  const d = `M0,0 L${W},0 L${W},${H} L0,${H} Z `
          + `M${Q.a.x},${Q.a.y} L${Q.b.x},${Q.b.y} L${Q.c.x},${Q.c.y} L${Q.d.x},${Q.d.y} Z`;
  const path = svgEl('path', {
    d, 'fill-rule': 'evenodd', fill: HUD.maskColor, 'fill-opacity': HUD.maskOpacity
  });
  path.style.pointerEvents = 'none';
  g.appendChild(path);
}

function hudMakeIsolable(el, entry) {
  // Isolation au clic désactivée : le HUD ne capte plus aucun événement tactile,
  // ce qui garantit que le menu et la navigation restent interactifs en vue de dessus.
  return;
}

/* Recalcule et redessine tout le HUD (appelé chaque frame en vue de dessus). */
let hudEdges = {};   // { top|bottom|left|right : {w0,w1,p0,p1} } — rempli par hudUpdate

function hudUpdate() {
  const g = document.getElementById('hud-content');
  if (!g || !modelBounds) return;
  hudScale = computeHudScale(); // recalcule l'échelle à chaque frame (suit les resize)
  while (g.firstChild) g.removeChild(g.firstChild);

  const { min, max } = modelBounds;
  const yFloor = min.y;    // plan du sol (pour libellés)
  const yTop = max.y;      // sommet du mur (pour cotations, aligné avec le clic)
  const labels = hudRoomLabels();
  afficherMarqueurPov(EDIT_MODE && povEnAttenteX != null);

  // Charger les offsets (depuis manifest si disponibles, sinon defaults HUD)
  const offs = getHudOffsets();

  // ===== MODE ISOLATION : une pièce active, le reste assombri =====
  if (hudIsolatedRoom && hudIsolatedRoom.rect) {
    const r = hudIsolatedRoom.rect;
    const yR = (r[4] != null ? r[4] : yTop);  // sommet du mur pour l'isolation aussi
    const Q = hudProjectRect(r, yR);
    hudDrawMask(g, Q);                                   // assombrit les autres pièces
    hudQuadDimensions(g, Q, hudFormat(r[2] - r[0]),      // cotations de la pièce (4 côtés)
                      hudFormat(r[3] - r[1]), offs.roomDimOffset * hudOffsetFactor());
    hudRoomLabel(g, hudProject(hudIsolatedRoom.world), hudIsolatedRoom.label, false, hudIsolatedRoom.style); // libellé actif
    // Autres libellés, atténués, cliquables pour basculer directement
    labels.forEach(e => {
      if (e === hudIsolatedRoom || (e.id && e.id === hudIsolatedRoom.id)) return;
      hudMakeIsolable(hudRoomLabel(g, hudProject(e.world), e.label, true, e.style), e);
    });
    return;
  }

  // ===== MODE NORMAL : chaînes segmentées (par mur) + cote globale + noms =====
  const A = new BABYLON.Vector3(min.x, yTop, min.z), B = new BABYLON.Vector3(max.x, yTop, min.z);
  const C = new BABYLON.Vector3(max.x, yTop, max.z), D = new BABYLON.Vector3(min.x, yTop, max.z);
  const pA = hudProject(A), pB = hudProject(B), pC = hudProject(C), pD = hudProject(D);
  const edges = {
    minZ: { w: [A, B], p: [pA, pB] }, maxZ: { w: [D, C], p: [pD, pC] },
    minX: { w: [A, D], p: [pA, pD] }, maxX: { w: [B, C], p: [pB, pC] },
  };
  const avgY = e => (e.p[0].y + e.p[1].y) / 2, avgX = e => (e.p[0].x + e.p[1].x) / 2;
  const topE = avgY(edges.minZ) <= avgY(edges.maxZ) ? edges.minZ : edges.maxZ;
  const botE = topE === edges.minZ ? edges.maxZ : edges.minZ;
  const leftE = avgX(edges.minX) <= avgX(edges.maxX) ? edges.minX : edges.maxX;
  const rightE = leftE === edges.minX ? edges.maxX : edges.minX;

  const dims = (propertyData && propertyData.dimensions) || {};
  const wWidth = hudFormat(max.x - min.x), wDepth = hudFormat(max.z - min.z);

  // Dessine un côté : chaîne segmentée (si déclarée) + cote globale (selon globalSides / fallback)
  function drawSide(name, edge, normal, horizontal, overallText) {
    let w0 = edge.w[0], w1 = edge.w[1], p0 = edge.p[0], p1 = edge.p[1];
    const swap = horizontal ? (p0.x > p1.x) : (p0.y > p1.y); // sens de lecture
    if (swap) { const tw = w0; w0 = w1; w1 = tw; const tp = p0; p0 = p1; p1 = tp; }
    hudEdges[name] = { w0, w1, p0, p1 };   // memorise pour l'edition des cotations
    const segs = dims[name];
    if (segs && segs.length) hudChain(g, w0, w1, normal, segs, offs.segOffset * hudOffsetFactor());
    if (HUD.globalSides.includes(name) || !(segs && segs.length)) {
      hudDimension(g, p0, p1, normal, overallText, offs.dimOffset * hudOffsetFactor());
    }
  }
  drawSide('top',    topE,   { x: 0, y: -1 }, true,  wWidth);
  drawSide('bottom', botE,   { x: 0, y: 1 },  true,  wWidth);
  drawSide('left',   leftE,  { x: -1, y: 0 }, false, wDepth);
  drawSide('right',  rightE, { x: 1, y: 0 },  false, wDepth);

  labels.forEach(e => hudMakeIsolable(hudRoomLabel(g, hudProject(e.world), e.label, false, e.style), e));
}

function setHudVisible(on) {
  if (!HUD.enabled) on = false;
  hudVisible = on;
  if (EDIT_MODE) showTopViewZoomCtrl(on);  // show/hide zoom ctrl selon la vue
  if (!on) hudIsolatedRoom = null; // on sort toujours de l'isolation en quittant la vue
  const svg = document.getElementById('hud-svg');
  if (svg) svg.style.opacity = on ? '1' : '0';
  if (on) {
    hudUpdate();
    if (!hudObserver) {
      hudObserver = scene.onAfterRenderObservable.add(() => { if (hudVisible) hudUpdate(); });
    }
  } else if (hudObserver) {
    scene.onAfterRenderObservable.remove(hudObserver);
    hudObserver = null;
    const g = document.getElementById('hud-content');
    if (g) while (g.firstChild) g.removeChild(g.firstChild);
  }
}

/* ============================================================================
   TOGGLE PANNEAU POI (OUVERT/FERMÉ)
   ============================================================================ */
function togglePoiPanel() {
  isPoiPanelOpen = !isPoiPanelOpen;
  const panel = document.getElementById('poi-panel');
  const btn = document.getElementById('btn-toggle-panel');
  const container = document.querySelector('.right-panel-container');

  if (isPoiPanelOpen) {
    panel.classList.remove('closed');
  } else {
    panel.classList.add('closed');
  }

  // Coupe le flou du verre pendant le glissement + le recadrage caméra (perf),
  // puis le restaure une fois immobile.
  if (container) {
    container.classList.add('reframing');
    clearTimeout(container._reframeTimer);
    container._reframeTimer = setTimeout(() => container.classList.remove('reframing'), 760);
  }

  // Une transition est déjà en cours : son état final prendra en compte le panneau
  if (isAnimating) return;

  // En 1ère personne : rendu plein écran (le panneau reste en overlay à droite)
  if (isFirstPerson && fpCamera) {
    fpCamera.viewport = new BABYLON.Viewport(0, 0, 1, 1);
    return;
  }

  // Navigation OU vue de dessus : recadrage doux et cohérent du GLB
  reframeForPanel(true);
}

/* ============================================================================
   DÉCALAGE DU RENDU (plein écran + targetScreenOffset) — remplace le viewport partiel
   ----------------------------------------------------------------------------
   AVANT : on rétrécissait `camera.viewport` à gauche pour libérer la droite. Mais un
   viewport partiel casse tous les effets d'ESPACE-ÉCRAN (SSAO2, etc.) : ils lisent le
   depth buffer PLEIN CADRE → image fantôme dédoublée + modèle « rétracté » sur l'axe X.
   MAINTENANT : le rendu reste TOUJOURS plein écran (viewport 0,0,1,1). Pour pousser le
   modèle à gauche quand le panneau est ouvert, on décale la caméra en espace écran via
   `targetScreenOffset.x` (déjà utilisé pour la feuille mobile sur l'axe Y). Le depth
   buffer est cohérent → SSAO2 et tout post-process fonctionnent parfaitement.
   ============================================================================ */
function getTopViewViewportWidth() {
  // Sur petit écran (téléphone / tablette portrait), le panneau passe en overlay
  // plein écran : on ne réserve aucun espace 3D → pas de décalage.
  if (window.innerWidth < 900) return 1;
  const cv = document.getElementById('canvas');
  const canvasW = cv ? cv.clientWidth : window.innerWidth;
  // Largeur RÉELLE du panneau (responsive via CSS) → fraction réservée à droite.
  const wrap = document.querySelector('.right-panel-wrapper');
  const panelW = wrap ? wrap.getBoundingClientRect().width : 0;
  const panelFraction = canvasW > 0 ? panelW / canvasW : 0;
  return Math.max(0.25, 1 - panelFraction); // largeur « utile » mini 25%
}

function getEffectiveViewportWidth() {
  // Fraction de largeur « utile » (gauche) quand le panneau est ouvert ; sinon 1.
  // Sert au CALCUL DU RADIUS (le modèle garde sa taille apparente). Le rendu, lui,
  // reste plein écran — le décalage est appliqué par applyViewportShift().
  return isPoiPanelOpen ? getTopViewViewportWidth() : 1;
}

/* Largeur utile « actuelle » déduite du décalage écran en cours (pour démarrer une
   animation depuis l'état visuel réel, sans « clac »). Inverse de computeScreenShiftX. */
function getEffectiveViewportWidthAtStart() {
  if (!camera || !camera.targetScreenOffset) return getEffectiveViewportWidth();
  const off = camera.targetScreenOffset.x || 0;
  if (Math.abs(off) < 1e-4) return 1;
  const renderW = engine.getRenderWidth();
  const renderH = engine.getRenderHeight();
  const fovH = 2 * Math.atan(Math.tan(camera.fov / 2) * (renderW / renderH));
  const halfWorld = (camera.radius || 10) * Math.tan(fovH / 2);
  if (halfWorld <= 0) return 1;
  return Math.max(0.25, 1 - Math.abs(off) / halfWorld);
}

/* Convertit la fraction de largeur utile en décalage écran (unités monde) pour pousser
   le modèle dans la zone de gauche, rendu plein écran. */
function computeScreenShiftX(usableWidth, cam) {
  cam = cam || camera;
  if (!cam || usableWidth >= 0.999) return 0;
  const renderW = engine.getRenderWidth();
  const renderH = engine.getRenderHeight();
  const fovV = cam.fov || (camera && camera.fov) || 0.8;
  const aspect = renderW / renderH;
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * aspect);
  const r = cam.radius || 10;
  // Demi-largeur monde visible au niveau de la cible.
  const halfWorld = r * Math.tan(fovH / 2);
  // Le centre de la zone utile est à usableWidth/2 depuis le bord gauche ; en plein
  // écran le centre est à 0.5. Écart = (1 - usableWidth)/2. Le panneau est à DROITE :
  // on pousse le modèle À GAUCHE, dans la bande visible → targetScreenOffset.x NÉGATIF
  // (un offset positif décale le rendu vers la droite, sous le panneau). Si jamais le
  // modèle partait du mauvais côté, repasser SHIFT_SIGN à +1.
  const SHIFT_SIGN = -1;
  return SHIFT_SIGN * (1 - usableWidth) * halfWorld;
}

/* Applique le rendu plein écran + le décalage écran correspondant au panneau.
   Agit sur la caméra passée (ou la caméra active par défaut : nav ArcRotate ou fpCamera). */
function applyViewportShift(cam) {
  cam = cam || (isFirstPerson && fpCamera ? fpCamera : camera);
  if (!cam) return;
  cam.viewport = new BABYLON.Viewport(0, 0, 1, 1); // TOUJOURS plein écran
  if (cam.targetScreenOffset) {
    // En POV (vue 1ère personne), la vue est immersive plein écran, le panneau
    // reste en overlay : jamais de décalage horizontal sur la fpCamera.
    cam.targetScreenOffset.x = (isFirstPerson && cam === fpCamera)
      ? 0
      : computeScreenShiftX(getEffectiveViewportWidth(), cam);
  }
}

function applyTopViewViewport() {
  applyViewportShift();
}

function resetViewport() {
  applyViewportShift();
}

/* ============================================================================
   CADRAGE COHÉRENT — le GLB est toujours margé de la même manière
   quel que soit l'état du panneau (ouvert/fermé) et le mode (nav/top).
   ============================================================================ */

/* Distance de cadrage "fit" en NAVIGATION pour une largeur de viewport donnée.
   Indépendant du camera.viewport courant → on calcule l'aspect effectif nous-mêmes. */
function computeFitRadiusForViewport(viewportWidth) {
  if (!modelBounds) return initialFraming ? initialFraming.radius : 10;
  const fovV = camera.fov;
  const renderW = engine.getRenderWidth();
  const renderH = engine.getRenderHeight();
  const aspect = (renderW * viewportWidth) / renderH;     // aspect de la zone réellement rendue
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * aspect);
  const limitingFov = Math.min(fovV, fovH);
  return (modelBounds.radius / Math.sin(limitingFov / 2)) * CONFIG.fitMargin;
}

/* Anime en douceur le viewport ET le rayon (et éventuellement la cible) vers leurs
   valeurs cibles. Utilisé lors de l'ouverture/fermeture du panneau pour « remettre
   en place » le GLB sans saut. */
function animateViewportAndRadius(targetViewport, targetRadius, targetCenter, frames) {
  frames = frames || 40;
  if (currentAnimObserver) {
    scene.onBeforeRenderObservable.remove(currentAnimObserver);
    currentAnimObserver = null;
  }
  isAnimating = true;
  camera.detachControl();

  const startVp     = getEffectiveViewportWidthAtStart();
  const startRadius = camera.radius;
  const startTarget = camera.target.clone();

  // Libère temporairement les limites de zoom pour autoriser le changement de rayon
  camera.lowerRadiusLimit = null;
  camera.upperRadiusLimit = null;

  let frame = 0;
  currentAnimObserver = scene.onBeforeRenderObservable.add(() => {
    frame++;
    const t = Math.min(frame / frames, 1);
    const e = easeInOut(t);

    const vp = startVp + (targetViewport - startVp) * e;
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1); // plein écran
    camera.radius = startRadius + (targetRadius - startRadius) * e;
    if (targetCenter) camera.target = BABYLON.Vector3.Lerp(startTarget, targetCenter, e);
    if (camera.targetScreenOffset) camera.targetScreenOffset.x = computeScreenShiftX(vp, camera);

    if (t >= 1) {
      scene.onBeforeRenderObservable.remove(currentAnimObserver);
      currentAnimObserver = null;
      applyViewportShift(camera); // décalage final net
      isAnimating = false;
      if (isTopView) {
        // La vue de dessus reste verrouillée (caméra détachée)
        camera.radius = computeTopViewRadiusForViewport(targetViewport);
      } else {
        // Navigation : restaure des limites de zoom cohérentes + réactive les contrôles
        camera.lowerRadiusLimit = modelBounds.radius * zoomInRatio();
        camera.upperRadiusLimit = (initialFraming ? initialFraming.radius : targetRadius) * CONFIG.zoomOutLimitRatio;
        camera.attachControl(document.getElementById('canvas'), true);
      }
    }
  });
}

/* Recadre le GLB dans la zone visible courante (gauche si panneau ouvert, plein écran
   sinon), en conservant l'orientation. C'est LE point d'entrée unique appelé à chaque
   ouverture/fermeture du panneau pour garantir une marge constante. */
function reframeForPanel(animated) {
  if (!modelBounds || isAnimating) return;
  const targetViewport = getEffectiveViewportWidth();

  // Cible : recentrer sur le modèle ; rayon : « fit » selon le mode courant
  const center = modelBounds.center.clone();
  const targetRadius = isTopView
    ? computeTopViewRadiusForViewport(targetViewport)
    : computeFitRadiusForViewport(targetViewport);

  if (animated) {
    animateViewportAndRadius(targetViewport, targetRadius, center);
  } else {
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);
    camera.target = center;
    camera.radius = targetRadius;
    if (camera.targetScreenOffset) camera.targetScreenOffset.x = computeScreenShiftX(targetViewport, camera);
  }
}

/* ============================================================================
   CALCUL DYNAMIQUE DU RADIUS POUR LA VUE DE DESSUS
   Vu du dessus, on regarde un rectangle (largeur X × profondeur Z).
   On calcule la distance pour que ce rectangle tienne pile dans la fenêtre,
   selon le FOV vertical/horizontal le plus contraignant.
   ============================================================================ */
function computeTopViewRadius() {
  // Le viewport est désormais toujours plein écran (1) ; la largeur « utile » vient de
  // l'état du panneau, pas de camera.viewport.width.
  return computeTopViewRadiusForViewport(getEffectiveViewportWidth());
}

function computeTopViewRadiusForViewport(viewportWidth) {
  if (!modelBounds) return initialFraming.radius * 1.4;

  const halfWidth = (modelBounds.max.x - modelBounds.min.x) / 2;  // demi-largeur (X)
  const halfDepth = (modelBounds.max.z - modelBounds.min.z) / 2;  // demi-profondeur (Z)
  const fovV = camera.fov;                                        // FOV vertical (radians)

  const canvasWidth  = engine.getRenderWidth();
  const canvasHeight = engine.getRenderHeight();
  const viewportWidthPx = canvasWidth * viewportWidth; // largeur réellement rendue (hors panneau)

  // FOV horizontal correspondant à la largeur rendue (avant marges)
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * (viewportWidthPx / canvasHeight));

  // Fractions UTILES restantes après marges proportionnelles (responsive).
  // Sur téléphone : marges élargies → le plan occupe moins de place, laissant
  // entrer les cotations dans le cadre. (Branche isolée : desktop inchangé.)
  const phone = (typeof window !== 'undefined' && window.innerWidth < 900);
  const mL = phone ? 0.14 : CONFIG.topViewMarginLeftF;
  const mR = phone ? 0.14 : CONFIG.topViewMarginRightF;
  const mT = phone ? 0.17 : CONFIG.topViewMarginTopF;
  const mB = phone ? 0.14 : CONFIG.topViewMarginBottomF;
  const usableW = Math.max(0.2, 1 - mL - mR);
  const usableH = Math.max(0.2, 1 - mT - mB);

  // Distance pour que le modèle tienne dans la fraction utile : il occupe donc
  // toujours la même proportion d'écran, quelle que soit la résolution / le DPR.
  const distForDepth = (halfDepth / Math.tan(fovV / 2)) / usableH;
  const distForWidth = (halfWidth / Math.tan(fovH / 2)) / usableW;

  // On prend la plus contraignante → tout rentre dans la zone visible
  return Math.max(distForDepth, distForWidth) * CONFIG.topViewPadding;
}

let topViewZoom = 1;

/* POV : position en attente de validation (avant capture) */
let povEnAttenteX = null, povEnAttenteY = null, povEnAttenteZ = null;

function getHudOffsets(){
  /* Retourne les offsets des cotations depuis le manifest, ou les defaults HUD */
  const off = propertyData.dimOffsets || {};
  return {
    dimOffset: off.dimOffset || HUD.dimOffset,
    segOffset: off.segOffset || HUD.segOffset,
    roomDimOffset: off.roomDimOffset || HUD.roomDimOffset
  };
}

function afficherMarqueurPov(show){
  const circ = document.getElementById('pov-marker-circle');
  const dot  = document.getElementById('pov-marker-dot');
  if (!show || povEnAttenteX == null || !modelBounds){
    if (circ) circ.style.display = 'none';
    if (dot)  dot.style.display = 'none';
    return;
  }
  const p = hudProject(new BABYLON.Vector3(povEnAttenteX, modelBounds.min.y, povEnAttenteZ));
  if (circ){
    circ.setAttribute('cx', p.x);
    circ.setAttribute('cy', p.y);
    circ.style.display = 'block';
  }
  if (dot){
    dot.setAttribute('cx', p.x);
    dot.setAttribute('cy', p.y);
    dot.style.display = 'block';
  }
}

/* Passer en mode orthographique avec cadrage sur le modèle */
function switchToOrthographic() {
  if (!modelBounds) return;

  // SSAO2 est calibré pour la perspective (profondeur réelle) → léger halo en ortho.
  // On le neutralise en vue de dessus éditeur, réactivé au retour perspective.
  try { if (window.ssao2Pipeline) window.ssao2Pipeline.totalStrength = 0; } catch (_) {}

  camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;

  // Calibrer la taille ortho sur les dimensions réelles du modèle
  const width = modelBounds.max.x - modelBounds.min.x;
  const depth = modelBounds.max.z - modelBounds.min.z;
  const aspect = engine.getAspectRatio(camera);

  // Prendre la plus grande dimension pour que tout rentre.
  // topViewZoom (editeur seulement) resserre la boite ortho : le GLB ET les
  // cotations grossissent ensemble, puisque le HUD projette via cette camera.
  const halfSize = Math.max(width, depth) / 2 * 1.15 / (topViewZoom || 1);

  camera.orthoTop = halfSize;
  camera.orthoBottom = -halfSize;
  camera.orthoLeft = -halfSize * aspect;
  camera.orthoRight = halfSize * aspect;
}

/* ============================================================================
   ★ CONTRÔLEUR BOTTOM-SHEET MOBILE
   ----------------------------------------------------------------------------
   Module autonome, actif UNIQUEMENT sur téléphone (max-width: 900px). Il
   transforme le panneau de droite en feuille glissante à paliers, sans jamais
   toucher à la caméra (le viewport reste plein sur mobile) ni au desktop.
   - PORTRAIT : paliers verticaux  peek → demi → plein  (translateY).
   - PAYSAGE  : replié / ouvert     (translateX, tranche à droite).
   Le contexte (liste des pièces vs POV) pilote le palier par défaut ; l'usager
   ajuste ensuite librement en glissant / tapant la poignée.
   ============================================================================ */
(function mobileSheet(){
  const wrapper   = document.querySelector('.right-panel-wrapper');
  const container = document.querySelector('.right-panel-container');
  const panel     = document.getElementById('poi-panel');
  if (!wrapper || !container || !panel) return;

  const mqMobile   = window.matchMedia('(max-width: 900px)');
  const mqPortrait = window.matchMedia('(orientation: portrait)');
  const mqTablet   = window.matchMedia('(max-width: 1200px)');
  const isMobile   = () => mqMobile.matches;
  const isTablet   = () => mqTablet.matches;  // tablette: 900px < width <= 1200px
  const isMobile_strict = () => isMobile() && !isTablet();  // mobile <900px seulement
  const isPortrait = () => mqPortrait.matches;

  // --- Poignée (insérée avant le panneau, hors du innerHTML régénéré) ---
  const handle = document.createElement('div');
  handle.className = 'sheet-handle';
  handle.id = 'sheet-handle';
  handle.innerHTML =
    '<div class="sheet-grip-wrap"><div class="sheet-grip"></div></div>' +
    '<div class="sheet-handle-row">' +
      '<span class="sheet-handle-label" id="sheet-handle-label">Visiter les pièces</span>' +
      '<span class="sheet-handle-hint" id="sheet-handle-hint">Glisser \u25B2</span>' +
    '</div>';
  container.insertBefore(handle, panel);

  // --- Voile (palier plein) ---
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  scrim.id = 'sheet-scrim';
  document.body.appendChild(scrim);

  // Glissé tactile sur les photos plein écran (mobile) : gauche/droite = photo
  // suivante/précédente, vers le bas = fermer. Complète les boutons ‹ ›.
  const lb = document.getElementById('lightbox');
  if (lb){
    let sx = 0, sy = 0, swiping = false;
    lb.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { swiping = false; return; }
      swiping = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    lb.addEventListener('touchend', e => {
      if (!swiping) return; swiping = false;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)){
        if (dx < 0 && typeof window.nextPhoto === 'function') window.nextPhoto();
        else if (dx > 0 && typeof window.prevPhoto === 'function') window.prevPhoto();
      } else if (dy > 70 && Math.abs(dy) > Math.abs(dx)){
        if (typeof window.closeLightbox === 'function') window.closeLightbox();
      }
    }, { passive: true });
  }

  let context = 'list';   // 'list' | 'pov'
  let detent  = 'peek';   // 'peek' (fermé) | 'open' (ouvert, ~demi-écran)
  let armPovRaise = false; // ne remonter la feuille qu'à l'ENTRÉE dans un POV

  function metrics(){
    const rect = container.getBoundingClientRect();
    if (isPortrait()){
      const H = rect.height || (window.innerHeight * 0.5);
      const P = parseFloat(getComputedStyle(container).getPropertyValue('--peek')) || 88;
      return { axis:'y', min:0, max: Math.max(0, H - P),
               pos:{ peek: Math.max(0, H - P), open: 0 } };
    }
    const W = rect.width || Math.min(340, window.innerWidth * 0.46);
    const E = parseFloat(getComputedStyle(container).getPropertyValue('--edge')) || 30;
    return { axis:'x', min:0, max: Math.max(0, W - E),
             pos:{ peek: Math.max(0, W - E), open: 0 } };
  }

  function setTranslate(axis, px){
    if (axis === 'y'){ container.style.transform = 'translateY(' + px + 'px)'; }
    else { container.style.transform = 'translateX(' + px + 'px)'; }
    container.style.setProperty(axis === 'y' ? '--sheet-ty' : '--sheet-tx', px + 'px');
  }

  function applyDetent(name, animate){
    detent = name;
    const m = metrics();
    const target = m.pos[name];               // open = 0 (les deux axes), peek = max
    if (animate === false) container.classList.add('dragging');
    setTranslate(m.axis, target);
    if (animate === false) requestAnimationFrame(() => container.classList.remove('dragging'));
    updateHint();
    fitCanvasToBand(animate);
  }

  function updateHint(){
    const hint = document.getElementById('sheet-handle-hint');
    if (!hint) return;
    if (!isPortrait()){ hint.textContent = ''; return; }
    hint.textContent = detent === 'peek' ? 'Ouvrir \u25B2' : 'Fermer \u25BC';
  }
  function setLabel(txt){
    const el = document.getElementById('sheet-handle-label');
    if (el) el.textContent = txt;
  }

  // --- Le modèle 3D s'adapte à la fenêtre réduite quand la feuille s'ouvre ---
  // Quand la feuille est ouverte (portrait), elle masque le bas de l'écran. On
  // recadre le modèle pour qu'il tienne ENTIÈREMENT dans la bande haute encore
  // visible : on DÉZOOME (le modèle rapetisse pour tenir dans ~54% de la hauteur)
  // et on le REMONTE pour le recentrer dans cette bande. Animé pour accompagner la
  // montée/descente de la feuille, et restauré à la fermeture. On ne touche qu'à des
  // propriétés caméra (rayon + décalage écran) : desktop et logique viewport intacts.
  // Si jamais le modèle remontait dans le mauvais sens, inverser le signe devant
  // (SHEET_RESERVE / 2) dans offsetTo.
  const SHEET_RESERVE = 0.38;   // moins de réserve = modèle plus grand
  let camPreRadius = null, camAnimRAF = null, camLimits = null;

  function camTween(cam, radiusTo, offsetTo, targetDeltaY){
    targetDeltaY = targetDeltaY || 0;  // décalage du pivot (pour suivre l'offset écran)
    const rFrom = cam.radius;
    const oFrom = (cam.targetScreenOffset && cam.targetScreenOffset.y) || 0;
    const tFrom = (cam.target && cam.target.y) || 0;
    if (Math.abs(radiusTo - rFrom) < 1e-3 && Math.abs(offsetTo - oFrom) < 1e-3 && Math.abs(targetDeltaY) < 1e-3){
      cam.radius = radiusTo;
      if (cam.targetScreenOffset) cam.targetScreenOffset.y = offsetTo;
      if (cam.target) cam.target.y = tFrom + targetDeltaY;
      return;
    }
    const t0 = performance.now(), dur = 340;
    if (camAnimRAF) cancelAnimationFrame(camAnimRAF);
    (function step(now){
      const t = Math.min((now - t0) / dur, 1);
      const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t;
      cam.radius = rFrom + (radiusTo - rFrom) * e;
      if (cam.targetScreenOffset) cam.targetScreenOffset.y = oFrom + (offsetTo - oFrom) * e;
      if (cam.target) cam.target.y = tFrom + targetDeltaY * e;
      if (t < 1) camAnimRAF = requestAnimationFrame(step);
    })(t0);
  }

  // Adapte la 3D à l'espace RÉELLEMENT visible : on réduit le canvas à la bande
  // au-dessus de la feuille (portrait) ou à sa gauche (paysage), puis on recadre le
  // modèle pour qu'il tienne entièrement dedans. Marche en NAVIGATION comme en VUE DE
  // DESSUS, pour n'importe quelle position du menu. Desktop/tablette : canvas plein.
  function fitCanvasToBand(animate){
    const cv = document.getElementById('canvas');
    if (!cv || typeof engine === 'undefined' || !engine || typeof camera === 'undefined' || !camera) return;

    // Desktop / tablette : canvas plein écran (c'est le viewport largeur qui gère le panneau droite).
    if (!isMobile()){
      if (cv.style.width || cv.style.height){
        cv.style.width = ''; cv.style.height = '';
        engine.resize();
        if (typeof reframeForPanel === 'function') reframeForPanel(false);
      }
      return;
    }

    // Réduit le canvas à la bande visible.
    const m = metrics();
    const target = m.pos[detent];
    const rect = container.getBoundingClientRect();
    if (m.axis === 'y'){
      const H = rect.height || (window.innerHeight * 0.5);
      cv.style.width = '';
      cv.style.height = Math.max(140, Math.round(window.innerHeight - H + target)) + 'px'; // du haut au sommet de la feuille
    } else {
      const W = rect.width || Math.min(340, window.innerWidth * 0.46);
      cv.style.height = '';
      cv.style.width = Math.max(180, Math.round(window.innerWidth - W + target)) + 'px';    // de gauche au bord de la feuille
    }
    engine.resize();   // le moteur relit la nouvelle taille → aspect à jour

    // Recadre le modèle dans le canvas redimensionné, sans se faire brider par les
    // limites de zoom (calées sur le plein écran).
    if (!modelBounds) return;
    const topView = (typeof isTopView !== 'undefined' && isTopView);
    const fp = (typeof isFirstPerson !== 'undefined' && isFirstPerson);
    if (fp) return;    // en POV (photo plein écran) : rien à recadrer côté 3D

    const fitR = topView
      ? computeTopViewRadiusForViewport(1)
      : computeFitRadiusForViewport(1);

    camera.lowerRadiusLimit = null;
    camera.upperRadiusLimit = null;
    camera.targetScreenOffset.x = 0; camera.targetScreenOffset.y = 0;
    camera.target = modelBounds.center.clone();
    camera.radius = fitR;
    if (!topView){
      camera.lowerRadiusLimit = modelBounds.radius * zoomInRatio();
      camera.upperRadiusLimit = Math.max(fitR, (initialFraming ? initialFraming.radius : fitR) * CONFIG.zoomOutLimitRatio);
    }
  }

  // --- Contexte piloté par les fonctions existantes ---
  function onList(){
    const wasPov = context === 'pov';
    context = 'list';
    if (!isMobile()) return;
    setLabel('Visiter les pièces');
    if (wasPov) applyDetent('peek', true);   // on sort d'un POV → on redescend
  }
  function onPov(poi){
    context = 'pov';
    if (!isMobile()) return;
    setLabel(poiLabel(poi) || 'Pièce');
    if (armPovRaise){ applyDetent('open', true); armPovRaise = false; }
  }
  function onGoToPOI(){
    armPovRaise = true;                        // prochaine entrée POV → on remonte
    if (isMobile()) applyDetent('peek', true); // on redescend pour admirer le fondu 3D
  }

  // --- Gestes (glisser + tap) ---
  let drag = null;
  function down(e){
    if (!isMobile()) return;
    const m = metrics();
    const startPos = m.axis === 'y' ? e.clientY : e.clientX;
    const cur = parseFloat(container.style.getPropertyValue(m.axis === 'y' ? '--sheet-ty' : '--sheet-tx'));
    const base = isNaN(cur) ? ((m.axis === 'x' && detent !== 'peek') ? 0 : m.pos[detent]) : cur;
    drag = { m, startPos, base, moved:0, last: base };
    container.classList.add('dragging');
    // NB : pas de setPointerCapture ici. Les écouteurs move/up sont sur `window`
    // (ils reçoivent le pointeur partout), et la capture provoquait sur certains
    // navigateurs mobiles des taps/glissés « avalés » → menu qui ne s'ouvrait pas.
  }
  function move(e){
    if (!drag) return;
    const p = drag.m.axis === 'y' ? e.clientY : e.clientX;
    const d = p - drag.startPos;
    drag.moved = Math.max(drag.moved, Math.abs(d));
    let t = drag.base + d;
    if (t < drag.m.min) t = drag.m.min;
    if (t > drag.m.max) t = drag.m.max;
    drag.last = t;
    setTranslate(drag.m.axis, t);
  }
  function up(){
    if (!drag) return;
    const st = drag; drag = null;
    container.classList.remove('dragging');
    if (st.moved < 8){ tapCycle(); return; }
    // 2 états seulement : on ouvre si la feuille a été montée de plus de 35% de
    // sa course (ou tirée vers le haut), sinon on referme. Jamais de position libre.
    const dir = st.last - st.base;               // <0 = tiré vers l'ouverture
    const openIf = (st.last < st.m.max * 0.65) || (dir < -40);
    applyDetent(openIf ? 'open' : 'peek', true);
  }
  function tapCycle(){
    applyDetent(detent === 'peek' ? 'open' : 'peek', true);
  }

  handle.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move, { passive: true });
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  scrim.addEventListener('click', () => applyDetent('peek', true));

  // --- Réagencrage à la rotation / redimensionnement ---
  function reposition(){
    if (!isMobile()){
      container.style.transform = '';
      container.style.removeProperty('--sheet-ty');
      container.style.removeProperty('--sheet-tx');
      scrim.classList.remove('show');
      fitCanvasToBand(false);   // canvas rendu plein écran + recadrage
      return;
    }
    applyDetent(detent, false);   // applyDetent recadre déjà via fitCanvasToBand
  }
  // À la rotation, on efface immédiatement la transform (l'axe change : translateY
  // portrait ↔ translateX paysage) pour éviter un décalage transitoire, puis on
  // recalcule le palier une fois la nouvelle mise en page stabilisée.
  function onOrientation(){
    if (isMobile()){ container.style.transform = ''; container.classList.add('dragging'); }
    setTimeout(() => { reposition(); }, 260);
  }
  window.addEventListener('resize', reposition);
  window.addEventListener('orientationchange', onOrientation);
  if (mqPortrait.addEventListener) mqPortrait.addEventListener('change', onOrientation);
  // Passage du seuil 900px (rotation, fenêtre redimensionnée) : le contenu du
  // panneau diffère entre téléphone et desktop → on le reconstruit dans la bonne
  // variante, et on remet le libellé du bouton de bascule au bon format.
  function onBreakpoint(){
    reposition();
    try {
      if (typeof updateToggleButton === 'function') updateToggleButton();
      if (typeof isFirstPerson !== 'undefined' && !isFirstPerson
          && typeof rebuildPoiList === 'function') rebuildPoiList();
    } catch(_){}
  }
  if (mqMobile.addEventListener)   mqMobile.addEventListener('change', onBreakpoint);

  // --- Enrobage non intrusif des fonctions existantes ---
  function wrap(name, after){
    const orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function(){
      const r = orig.apply(this, arguments);
      try { after.apply(this, arguments); } catch(_){}
      return r;
    };
  }
  wrap('rebuildPoiList', onList);
  wrap('showFirstPersonPhoto', function(poi){ onPov(poi); });
  wrap('goToPOI', onGoToPOI);
  wrap('toggleViewMode', function(){ fitCanvasToBand(false); });

  // Palier initial
  if (isMobile()) applyDetent('peek', false);
})();

init();
</script>
</body>
</html>
